<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Description Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🤖 AI Seller Toolkit</h1>

<a href="tools.html">⬅ Back</a>

</header>


<section class="hero">

<h2>AI Product Description Generator</h2>

<p>Create Professional Product Descriptions with AI</p>

</section>


<section class="tools">

<div class="card">

<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Cotton T-Shirt">


<br><br>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing">


<br><br>


<label>Brand</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud">


<br><br>


<label>Material</label>

<input
type="text"
id="material"
placeholder="Example: 100% Cotton">


<br><br>


<label>Color</label>

<input
type="text"
id="color"
placeholder="Example: Black">


<br><br>


<label>Features</label>

<textarea
id="features"
rows="5"
placeholder="Example: Comfortable, Durable, Stylish, Lightweight">
</textarea>


<br><br>


<button onclick="generateDescription()">

🤖 Generate AI Description

</button>


<br><br>


<h3>Generated AI Description</h3>

<textarea
id="result"
rows="15"
style="width:100%;"
readonly
placeholder="Your AI generated description will appear here...">
</textarea>


<br><br>


<button onclick="copyDescription()">

📋 Copy Description

</button>

</div>

</section>


<script src="description-generator.js"></script>


</body>

  </html>
