<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Features Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🤖 AI Seller Toolkit</h1>

<a href="tools.html">⬅ Back</a>

</header>


<section class="hero">

<h2>⭐ AI Product Features Generator</h2>

<p>Create Professional Product Features with AI</p>

</section>


<section class="tools">

<div class="card">

<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Cotton T-Shirt">


<br><br>


<label>Brand Name</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud">


<br><br>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing">


<br><br>


<label>Material</label>

<input
type="text"
id="material"
placeholder="Example: 100% Cotton">


<br><br>


<label>Target Audience</label>

<select id="audience">

<option value="Men">Men</option>

<option value="Women">Women</option>

<option value="Kids">Kids</option>

<option value="Unisex">Unisex</option>

</select>


<br><br>


<label>Color</label>

<input
type="text"
id="color"
placeholder="Example: Black">


<br><br>


<label>Extra Information</label>

<textarea
id="extra"
rows="4"
placeholder="Example: Soft, lightweight, comfortable, durable">
</textarea>


<br><br>


<button onclick="generateFeatures()">

🤖 Generate AI Features

</button>


<br><br>


<h3>⭐ Generated Features</h3>

<textarea
id="result"
rows="15"
style="width:100%;"
readonly
placeholder="Your AI generated product features will appear here...">
</textarea>


<br><br>


<button onclick="copyFeatures()">

📋 Copy Features

</button>

</div>

</section>


<script src="product-features-generator.js"></script>


</body>

  </html>
