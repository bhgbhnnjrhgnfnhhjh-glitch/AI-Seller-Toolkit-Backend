<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Title Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🤖 AI Seller Toolkit</h1>

<a href="tools.html">⬅ Back</a>

</header>


<section class="hero">

<h2>AI Product Title Generator</h2>

<p>Create High Converting Product Titles with AI</p>

</section>


<section class="tools">

<div class="card">

<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Cotton T-Shirt">


<br><br>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing">


<br><br>


<label>Brand</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud">


<br><br>


<label>Main Keyword</label>

<input
type="text"
id="keyword"
placeholder="Example: Black Cotton T-Shirt">


<br><br>


<button onclick="generateTitle()">

🤖 Generate AI Title

</button>


<h3>Generated AI Title</h3>

<textarea
id="result"
rows="10"
readonly
style="width:100%;"
placeholder="Your AI generated titles will appear here...">
</textarea>


<br><br>


<button onclick="copyTitle()">

📋 Copy Title

</button>

</div>

</section>


<!-- AI JavaScript -->

<script src="title-generator.js"></script>


</body>

</html>
