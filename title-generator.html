<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AI Product Title Generator</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<header>

    <h1>🤖 AI Seller Toolkit</h1>

    <a href="tools.html">
        ⬅ Back
    </a>

</header>


<section class="hero">

    <h2>
        AI Product Title Generator
    </h2>

    <p>
        Create High Converting Product Titles with AI
    </p>

</section>


<section class="tools">

    <div class="card">


        <!-- PRODUCT NAME -->

        <label for="product">
            Product Name
        </label>

        <input
            type="text"
            id="product"
            placeholder="Example: Cotton T-Shirt"
        >


        <br><br>


        <!-- CATEGORY -->

        <label for="category">
            Category
        </label>

        <input
            type="text"
            id="category"
            placeholder="Example: Men's Clothing"
        >


        <br><br>


        <!-- BRAND -->

        <label for="brand">
            Brand
        </label>

        <input
            type="text"
            id="brand"
            placeholder="Example: Fashion Hud"
        >


        <br><br>


        <!-- MAIN KEYWORD -->

        <label for="keyword">
            Main Keyword
        </label>

        <input
            type="text"
            id="keyword"
            placeholder="Example: Black Cotton T-Shirt"
        >


        <br><br>


        <!-- GENERATE BUTTON -->

        <button
            type="button"
            onclick="generateTitle()"
        >

            🤖 Generate AI Title

        </button>


        <h3>
            Generated AI Title
        </h3>


        <!-- RESULT -->

        <textarea
            id="result"
            rows="10"
            readonly
            style="width:100%;"
            placeholder="Your AI generated titles will appear here..."
        ></textarea>


        <br><br>


        <!-- COPY BUTTON -->

        <button
            type="button"
            onclick="copyTitle()"
        >

            📋 Copy Title

        </button>


    </div>

</section>


<!-- =====================================
     NO POPUP SCRIPT
     पहले load होगा
===================================== -->

<script src="no-popup.js"></script>


<!-- =====================================
     TITLE GENERATOR SCRIPT
===================================== -->

<script src="title-generator.js"></script>


</body>

</html>
