<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discount Calculator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#16a34a;
color:white;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.result{
margin-top:20px;
padding:15px;
background:#f8fafc;
border:1px solid #ddd;
border-radius:8px;
line-height:2;
font-size:18px;
}

.copyBtn{
background:#2563eb;
margin-top:10px;
}

.copyBtn:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<header>
🏷️ Discount Calculator
</header>

<div class="container">

<label>Original Price (₹)</label>
<input type="number" id="price" placeholder="Example: 1000">

<label>Discount (%)</label>
<input type="number" id="discount" placeholder="Example: 20">

<button onclick="calculateDiscount()">
Calculate Discount
</button>

<div class="result" id="result">
Enter price and discount percentage.
</div>

<button class="copyBtn" onclick="copyResult()">
Copy Result
</button>

</div>

<script>

function calculateDiscount(){

let price=Number(document.getElementById("price").value);
let discount=Number(document.getElementById("discount").value);

if(price<=0 || discount<0){
alert("Please enter valid values.");
return;
}

let save=(price*discount)/100;
let finalPrice=price-save;

document.getElementById("result").innerHTML=
"<b>Original Price:</b> ₹"+price+
"<br><b>Discount:</b> "+discount+"%"+
"<br><b>You Save:</b> ₹"+save.toFixed(2)+
"<br><b>Final Price:</b> ₹"+finalPrice.toFixed(2);

}

function copyResult(){

let text=document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("Result copied successfully!");

}

</script>

</body>
</html>
