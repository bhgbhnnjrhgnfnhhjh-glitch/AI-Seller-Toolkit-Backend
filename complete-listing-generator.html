<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Complete Listing Generator - AI Seller Toolkit</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        .container {
            max-width: 900px;
            margin: 25px auto;
            padding: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        #generateListingBtn {
            width: 100%;
            background: #2563eb;
            color: white;
            font-size: 17px;
        }

        #generateListingBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary {
            background: #111827;
            color: white;
            margin-right: 8px;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .result-box {
            margin-top: 15px;
        }

        .result-box h3 {
            margin-bottom: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 15px;
            font-weight: bold;
        }

        #message {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .category-note {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h1>🤖 AI Seller Toolkit</h1>
    <p>Complete AI Product Listing Generator</p>
</header>

<div class="container">

    <div id="message"></div>

    <!-- ================= INPUT ================= -->

    <div class="card">

        <h2>🛍️ Product Information</h2>

        <label>Product Category</label>

        <select id="category">

            <option value="Fashion">👗 Fashion</option>
            <option value="Beauty">💄 Beauty</option>
            <option value="Electronics">📱 Electronics</option>
            <option value="Home & Kitchen">🏠 Home & Kitchen</option>
            <option value="Shoes">👟 Shoes</option>
            <option value="Jewellery">💍 Jewellery</option>
            <option value="Toys">🧸 Toys</option>
            <option value="Books">📚 Books</option>
            <option value="Pet">🐶 Pet</option>
            <option value="Sports">🏋️ Sports</option>
            <option value="Automotive">🚗 Automotive</option>
            <option value="Garden">🌱 Garden</option>
            <option value="Food">🍎 Food</option>
            <option value="Gifts">🎁 Gifts</option>

        </select>

        <div class="category-note">
            AI आपके चुने हुए category के अनुसार listing बनाएगा।
        </div>


        <label>Product Name *</label>

        <input
            type="text"
            id="productName"
            placeholder="Example: Cotton Kurti"
        >


        <label>Brand</label>

        <input
            type="text"
            id="brand"
            placeholder="Example: XYZ"
        >


        <label>Price</label>

        <input
            type="text"
            id="price"
            placeholder="Example: ₹599"
        >


        <label>Color</label>

        <input
            type="text"
            id="color"
            placeholder="Example: Blue"
        >


        <label>Material / Fabric</label>

        <input
            type="text"
            id="material"
            placeholder="Example: Cotton"
        >


        <label>Size / Dimensions</label>

        <input
            type="text"
            id="size"
            placeholder="Example: M / 40 x 30 cm"
        >


        <label>Model / SKU</label>

        <input
            type="text"
            id="model"
            placeholder="Optional"
        >


        <label>Quantity</label>

        <input
            type="text"
            id="quantity"
            placeholder="Example: 1 Piece"
        >


        <label>Product Features</label>

        <textarea
            id="features"
            placeholder="अपनी product की असली features लिखें..."
        ></textarea>


        <label>Extra Product Information</label>

        <textarea
            id="description"
            placeholder="Product के बारे में अतिरिक्त जानकारी..."
        ></textarea>


        <button
            id="generateListingBtn">
            ✨ Generate Complete Listing
        </button>

        <div
            id="loading"
            class="loading">
            🤖 AI listing बना रहा है...
        </div>

    </div>


    <!-- ================= RESULT ================= -->

    <div
        id="listingResult"
        class="card"
        style="display:none;">

        <h2>📋 Generated Listing</h2>


        <div class="result-box">

            <h3>🏷️ Product Title</h3>

            <textarea
                id="generatedTitle"
                readonly></textarea>

        </div>


        <div class="result-box">

            <h3>📝 Description</h3>

            <textarea
                id="generatedDescription"
                readonly></textarea>

        </div>


        <div class="result-box">

            <h3>⭐ Key Highlights</h3>

            <textarea
                id="generatedHighlights"
                readonly></textarea>

        </div>


        <div class="result-box">

            <h3>🔎 SEO Keywords</h3>

            <textarea
                id="generatedKeywords"
                readonly></textarea>

        </div>


        <div class="result-box">

            <h3>🏷️ Search Tags</h3>

            <textarea
                id="generatedTags"
                readonly></textarea>

        </div>


        <div class="result-box">

            <h3>📊 Specifications</h3>

            <textarea
                id="generatedSpecifications"
                readonly></textarea>

        </div>


        <button
            class="secondary"
            id="copyListingBtn">
            📋 Copy Complete Listing
        </button>


        <button
            class="secondary"
            id="downloadListingBtn">
            ⬇️ Download
        </button>


        <button
            class="danger"
            id="clearListingBtn">
            🗑️ Clear
        </button>

    </div>

</div>


<script src="complete-listing-generator.js"></script>

</body>
</html>
