<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced SEO Title Generator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:white;
padding:18px;
text-align:center;
font-size:24px;
font-weight:bold;
}

.container{
max-width:700px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#16a34a;
color:white;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.result{
margin-top:20px;
padding:15px;
background:#f8fafc;
border:1px solid #ddd;
border-radius:8px;
line-height:1.8;
font-size:17px;
}

.copyBtn{
background:#2563eb;
margin-top:10px;
}

.copyBtn:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<header>
⭐ Advanced SEO Title Generator
</header>

<div class="container">

<label>Product Name</label>
<input type="text" id="product" placeholder="Example: Cotton T-Shirt">

<label>Brand Name</label>
<input type="text" id="brand" placeholder="Example: Nike">

<label>Marketplace</label>
<select id="market">
<option>Amazon</option>
<option>Flipkart</option>
<option>Meesho</option>
<option>Shopify</option>
<option>Etsy</option>
</select>

<button onclick="generateTitle()">
Generate SEO Title
</button>

<div class="result" id="result">
Your SEO title will appear here...
</div>

<button class="copyBtn" onclick="copyTitle()">
Copy Title
</button>

</div>

<script>

function generateTitle(){

let product=document.getElementById("product").value.trim();
let brand=document.getElementById("brand").value.trim();
let market=document.getElementById("market").value;

if(product==""){
alert("Please enter Product Name.");
return;
}

let title="Buy Premium "+product;

if(brand!=""){
title+=" by "+brand;
}

title+=" Online | Best Price in India | "+market;

document.getElementById("result").innerHTML=title;

}

function copyTitle(){

let text=document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("SEO Title Copied Successfully!");

}  
<script src="advanced-title-generator.js"></script>

</script>

</body>
</html>
