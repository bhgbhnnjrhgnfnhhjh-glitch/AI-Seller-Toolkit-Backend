<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Calculator</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:white;
text-align:center;
padding:18px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:600px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#16a34a;
color:white;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.result{
margin-top:20px;
padding:15px;
background:#f8fafc;
border:1px solid #ddd;
border-radius:8px;
line-height:2;
font-size:18px;
}
</style>

</head>

<body>

<header>
🧾 GST Calculator
</header>

<div class="container">

<label>Product Price (₹)</label>
<input type="number" id="price" placeholder="Enter Product Price">

<label>GST Rate</label>
<select id="gst">
<option value="5">5%</option>
<option value="12">12%</option>
<option value="18" selected>18%</option>
<option value="28">28%</option>
</select>

<button onclick="calculateGST()">
Calculate GST
</button>

<div class="result" id="result">
Enter price and click Calculate GST.
</div>

</div>

<script>

function calculateGST(){

let price=Number(document.getElementById("price").value);
let gst=Number(document.getElementById("gst").value);

if(price<=0){
alert("Please enter a valid price.");
return;
}

let gstAmount=(price*gst)/100;
let total=price+gstAmount;

document.getElementById("result").innerHTML=
"<b>Product Price:</b> ₹"+price+
"<br><b>GST Rate:</b> "+gst+"%"+
"<br><b>GST Amount:</b> ₹"+gstAmount.toFixed(2)+
"<br><b>Total Price:</b> ₹"+total.toFixed(2);

}

</script>

</body>
</html>
