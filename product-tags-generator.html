<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Tags Generator</title>

<link rel="stylesheet" href="style.css">

<style>

.tags-container{
    max-width:700px;
    margin:30px auto;
}

.tag-card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.tag-card label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

.tag-card input,
.tag-card select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.generate-btn,
.copy-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:8px;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.generate-btn{
    background:#16a34a;
}

.generate-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.copy-btn{
    background:#2563eb;
}

.result-box{
    width:100%;
    min-height:300px;
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#f8fafc;
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.8;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

</style>

</head>


<body>


<header>

<h1>🏷️ AI Product Tags Generator</h1>

<a href="tools.html">⬅ Back to Tools</a>

</header>


<div class="container tags-container">


<div class="tag-card">


<h2>Generate Product Tags</h2>


<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Black Cotton T-Shirt"
>


<label>Brand Name</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud"
>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing"
>


<label>Target Audience</label>

<input
type="text"
id="audience"
placeholder="Example: Men"
>


<label>Platform</label>

<select id="platform">

<option>Amazon</option>
<option>Flipkart</option>
<option>Meesho</option>
<option>Shopify</option>
<option>Etsy</option>

</select>


<button
class="generate-btn"
id="generateBtn"
onclick="generateTags()"
>
🤖 Generate AI Product Tags
</button>


<div
class="status"
id="status">
</div>


<div
class="result-box"
id="result"
>
AI product tags will appear here...
</div>


<button
class="copy-btn"
onclick="copyTags()"
>
📋 Copy Tags
</button>


</div>

</div>



<script>


/* =========================================
   GEMINI BACKEND
========================================= */

const API_URL =
"https://ai-seller-toolkit-backend-1.onrender.com/generate";



/* =========================================
   GENERATE TAGS
========================================= */

async function generateTags(){

    const product =
        document.getElementById("product")
        .value
        .trim();

    const brand =
        document.getElementById("brand")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const audience =
        document.getElementById("audience")
        .value
        .trim();

    const platform =
        document.getElementById("platform")
        .value;

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("generateBtn");


    if(product === ""){

        alert("कृपया Product Name भरें।");

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ Generating...";

    status.innerText =
        "AI अच्छे product tags बना रहा है...";

    result.innerText =
        "⏳ Please wait...";



    /*
    =========================================
    STRICT GEMINI PROMPT
    =========================================
    */

    const prompt = `

You are a professional eCommerce product-tag specialist.

Your task is to create ONLY useful search tags for the EXACT product.

PRODUCT INFORMATION

Product Name:
${product}

Brand:
${brand || "Not specified"}

Category:
${category || "Not specified"}

Target Audience:
${audience || "Not specified"}

Platform:
${platform}


=========================================
ABSOLUTE RULES
=========================================

1. The Product Name is the most important information.

2. NEVER change the actual product type.

3. NEVER replace one product type with another.

4. Use ONLY information supplied by the user.

5. Never invent:
   color
   material
   gender
   size
   feature
   specification
   benefit
   quality
   price
   offer


=========================================
NO USELESS TAGS
=========================================

NEVER create tags containing these words
unless the exact word was supplied by the user:

best
premium
amazing
excellent
luxury
quality
trending
bestseller
original
fashion
style
look
wear
collection
range
line
item
product
goods
gear
merchandise
garment
apparel
store
shopping
online
sale
offer
deal
buy
shop


=========================================
NO REPETITION
=========================================

Do NOT create spelling variations.

For example, these are duplicates:

Black Cotton T-Shirt
Black Cotton T Shirt
Black Cotton Tshirt

Use only ONE.

Do not create the same product by simply changing
the word order.

Do not create unnecessary combinations.


=========================================
TAG QUALITY
=========================================

Each tag must add useful search meaning.

Prefer combinations using:

Product Name
Brand
Category
Target Audience

Only when those values were actually supplied.


=========================================
QUANTITY
=========================================

Create between 8 and 12 HIGH-QUALITY tags.

IMPORTANT:

Do NOT try to reach 20.

Do NOT create bad tags just to increase the number.

If only 8 useful tags are possible, return 8.

If 10 useful tags are possible, return 10.

Quality is more important than quantity.


=========================================
OUTPUT
=========================================

Return ONLY the tags.

One tag per line.

Do NOT number them.

Do NOT use bullets.

Do NOT add explanations.

Do NOT add headings.

`;


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        prompt:prompt
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.details ||
                data.error ||
                "Server error"
            );

        }


        if(
            !data.result ||
            !data.result.trim()
        ){

            throw new Error(
                "AI ने कोई tags नहीं बनाए।"
            );

        }


        const tags =
            cleanAndFilterTags(
                data.result,
                product,
                brand,
                category,
                audience
            );


        if(tags.length === 0){

            throw new Error(
                "AI response में कोई valid tag नहीं मिला।"
            );

        }


        result.innerText =
            tags
            .map(
                (tag,index) =>
                `${index + 1}. ${tag}`
            )
            .join("\n");


        status.innerText =
            `✅ ${tags.length} high-quality tags generated.`;


    }
    catch(error){

        console.error(
            "Product Tags Error:",
            error
        );


        result.innerText =
            "❌ Product tags generate नहीं हो सके.\n\n" +
            "Error: " +
            error.message;


        status.innerText =
            "Please try again.";

    }
    finally{

        button.disabled = false;

        button.innerText =
            "🤖 Generate AI Product Tags";

    }

}



/* =========================================
   FINAL LOCAL FILTER
========================================= */

function cleanAndFilterTags(
    text,
    product,
    brand,
    category,
    audience
){

    let lines =
        text.split(/\n/);


    /*
    Remove numbers and bullets
    */

    lines =
        lines.map(function(line){

            return line
                .replace(
                    /^\s*(\d+[\.\)\-:]|\-|\*)\s*/,
                    ""
                )
                .trim();

        });


    /*
    Remove empty lines
    */

    lines =
        lines.filter(Boolean);


    /*
    Remove code formatting
    */

    lines =
        lines.map(function(tag){

            return tag
                .replace(/```/g,"")
                .replace(/\*\*/g,"")
                .replace(/^["']|["']$/g,"")
                .trim();

        });


    /*
    Remove duplicates
    */

    const unique = [];

    const seen = new Set();


    lines.forEach(function(tag){

        const key =
            normalizeTag(tag);


        if(!seen.has(key)){

            seen.add(key);

            unique.push(tag);

        }

    });



    /*
    Product information
    */

    const productWords =
        getWords(product);

    const brandWords =
        getWords(brand);

    const categoryWords =
        getWords(category);

    const audienceWords =
        getWords(audience);


    /*
    Words which are NOT useful
    */

    const forbidden = [

        "best",
        "premium",
        "amazing",
        "excellent",
        "luxury",
        "quality",
        "trending",
        "bestseller",
        "original",

        "fashion",
        "style",
        "look",
        "wear",
        "collection",
        "range",
        "line",

        "item",
        "product",
        "goods",
        "gear",
        "merchandise",
        "garment",
        "apparel",

        "store",
        "shopping",
        "online",
        "sale",
        "offer",
        "deal",
        "buy",
        "shop"

    ];


    const result = [];


    unique.forEach(function(tag){

        if(result.length >= 12){
            return;
        }


        const lower =
            tag.toLowerCase();


        /*
        Reject forbidden words
        */

        let invalid = false;


        forbidden.forEach(function(word){

            if(
                lower.includes(word) &&
                !product.toLowerCase().includes(word) &&
                !category.toLowerCase().includes(word)
            ){

                invalid = true;

            }

        });


        if(invalid){
            return;
        }


        /*
        Reject tags that are too short
        */

        if(
            tag.length < 3
        ){
            return;
        }


        /*
        Reject obvious unrelated product types
        */

        const wrongTypes = [

            "jeans",
            "trouser",
            "pants",
            "dress",
            "skirt",
            "jacket",
            "hoodie",
            "sweater",
            "shoes",
            "sandals",
            "saree",
            "kurta",
            "blazer",
            "polo"

        ];


        for(
            const wrong of wrongTypes
        ){

            if(
                lower.includes(wrong) &&
                !product.toLowerCase().includes(wrong)
            ){

                return;

            }

        }


        /*
        Tag must contain at least
        one important product word.
        */

        const importantWords = [

            ...productWords,
            ...brandWords,
            ...categoryWords,
            ...audienceWords

        ];


        const hasRelevantWord =
            importantWords.some(function(word){

                return (
                    word.length >= 3 &&
                    lower.includes(word)
                );

            });


        if(!hasRelevantWord){
            return;
        }


        /*
        Remove duplicate variations
        */

        const normalized =
            normalizeTag(tag);


        const alreadySimilar =
            result.some(function(existing){

                return (
                    normalizeTag(existing)
                    === normalized
                );

            });


        if(alreadySimilar){
            return;
        }


        result.push(tag);

    });


    return result;

}



/* =========================================
   NORMALIZE TAG
========================================= */

function normalizeTag(tag){

    return tag
        .toLowerCase()
        .replace(/t[\s\-]?shirt/g,"tshirt")
        .replace(/\s+/g," ")
        .replace(/[^a-z0-9 ]/g,"")
        .trim();

}



/* =========================================
   GET WORDS
========================================= */

function getWords(text){

    if(!text){
        return [];
    }


    return text
        .toLowerCase()
        .replace(/[^a-z0-9\s\-]/g," ")
        .split(/[\s\-]+/)
        .filter(function(word){

            return word.length >= 3;

        });

}



/* =========================================
   COPY
========================================= */

async function copyTags(){

    const result =
        document.getElementById("result");


    const text =
        result.innerText.trim();


    if(
        !text ||
        text ===
        "AI product tags will appear here..."
    ){

        alert(
            "पहले Product Tags generate करें।"
        );

        return;

    }


    if(
        text.startsWith("❌")
    ){

        alert(
            "पहले valid tags generate करें।"
        );

        return;

    }


    try{

        await navigator.clipboard
            .writeText(text);


        alert(
            "✅ Product Tags copied successfully!"
        );

    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            text;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "✅ Product Tags copied successfully!"
        );

    }

}

</script>
<script src="no-popup.js"></script>

</body>

    </html>
