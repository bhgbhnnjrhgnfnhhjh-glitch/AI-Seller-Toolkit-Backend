<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Tags Generator</title>

<link rel="stylesheet" href="style.css">

<style>

.tags-container{
    max-width:700px;
    margin:30px auto;
}

.tag-card{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.tag-card label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

.tag-card input,
.tag-card select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

.generate-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.generate-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.result-box{
    width:100%;
    min-height:300px;
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#f8fafc;
    white-space:pre-wrap;
    font-size:16px;
    line-height:1.8;
}

.copy-btn{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:14px;
}

</style>

</head>


<body>


<header>

<h1>🏷️ AI Product Tags Generator</h1>

<a href="tools.html">⬅ Back to Tools</a>

</header>


<div class="container tags-container">


<div class="tag-card">


<h2>Generate Product Tags</h2>


<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Black Cotton T-Shirt"
>


<label>Brand Name</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud"
>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing"
>


<label>Target Audience</label>

<input
type="text"
id="audience"
placeholder="Example: Men"
>


<label>Platform</label>

<select id="platform">

<option>Amazon</option>
<option>Flipkart</option>
<option>Meesho</option>
<option>Shopify</option>
<option>Etsy</option>
<option>Instagram</option>

</select>


<button
class="generate-btn"
id="generateBtn"
onclick="generateTags()"
>

🤖 Generate AI Product Tags

</button>


<div
class="status"
id="status">
</div>


<div
class="result-box"
id="result"
>
AI product tags will appear here...
</div>


<button
class="copy-btn"
onclick="copyTags()"
>

📋 Copy Tags

</button>


</div>

</div>



<script>


/* =====================================
   GEMINI BACKEND
===================================== */

const API_URL =
"https://ai-seller-toolkit-backend-1.onrender.com/generate";



/* =====================================
   GENERATE TAGS
===================================== */

async function generateTags(){

    const product =
        document
        .getElementById("product")
        .value
        .trim();

    const brand =
        document
        .getElementById("brand")
        .value
        .trim();

    const category =
        document
        .getElementById("category")
        .value
        .trim();

    const audience =
        document
        .getElementById("audience")
        .value
        .trim();

    const platform =
        document
        .getElementById("platform")
        .value;

    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("generateBtn");


    if(product === ""){

        alert("कृपया Product Name भरें।");

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ AI Tags बना रहा है...";


    status.innerText =
        "AI product tags generate कर रहा है...";


    result.innerText =
        "⏳ Please wait...";



    /*
       STRICT AI PROMPT
    */

    const prompt = `

You are an expert eCommerce product tag generator.

Generate product tags ONLY for the EXACT product supplied.

PRODUCT INFORMATION:

Product Name:
${product}

Brand:
${brand || "Not specified"}

Category:
${category || "Not specified"}

Target Audience:
${audience || "Not specified"}

Platform:
${platform}


==============================
STRICT PRODUCT TYPE RULES
==============================

1. The exact product type must NEVER change.

2. Do NOT invent another product type.

3. If the product is "Black Cotton T-Shirt",
   every tag must remain about a T-Shirt.

4. NEVER create:

shirt
top
polo
dress
hoodie
sweater
jacket
trouser
jeans

unless that exact product type was supplied.


==============================
STRICT INFORMATION RULES
==============================

5. Use ONLY information supplied by the user.

6. Do NOT invent:
- color
- material
- size
- gender
- features
- quality
- benefits
- specifications

7. Brand may be used only if supplied.

8. Audience may be used only if supplied.

9. Category may be used only if supplied.


==============================
TAG QUALITY RULES
==============================

10. Create useful search tags.

11. Do NOT create meaningless variations.

12. Do NOT simply rearrange the same words repeatedly.

13. Do NOT create tags such as:

Product
Item
Goods
Gear
Line
Range
Selection
Collection
Merchandise
Garment
Look
Style
Wear

unless these words are explicitly part of the supplied product information.

14. Do NOT use fake marketing words:

Best
Premium
Amazing
Excellent
Luxury
Trending
Bestseller
High Quality
Original

unless supplied by the user.

15. Do NOT use:
Online
Store
Shopping
Sale
Offer
Buy
Shop

unless genuinely appropriate to the supplied platform or product information.

16. Avoid duplicate or near-duplicate tags.

17. Do not create spelling variations such as:

Tshirt
T-Shirt
T Shirt

for the same tag.

Use one consistent spelling.

18. Do NOT add numbers.

19. Do NOT number the output.

20. Do NOT add explanations.


==============================
IMPORTANT
==============================

Quality is more important than quantity.

If only 8 useful tags are possible,
return 8 tags.

DO NOT create bad tags just to reach 20.


==============================
OUTPUT
==============================

Return ONLY the product tags.

One tag per line.

No numbers.

No bullets.

No explanations.

`;


    try{


        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                    JSON.stringify({
                        prompt:prompt
                    })
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.details ||
                data.error ||
                "Server error"
            );

        }


        if(
            !data.result ||
            !data.result.trim()
        ){

            throw new Error(
                "AI ने कोई tags नहीं बनाए।"
            );

        }


        /*
         * STRICT LOCAL FILTERING
         */

        const tags =
            filterTags(
                data.result,
                product,
                brand,
                category,
                audience
            );


        if(tags.length === 0){

            throw new Error(
                "कोई valid product tag नहीं मिला।"
            );

        }


        result.innerText =
            tags
            .map((tag,index)=>
                `${index + 1}. ${tag}`
            )
            .join("\n");


        status.innerText =
            `✅ ${tags.length} valid product tags generated.`;


    }
    catch(error){

        console.error(
            "Product Tags Error:",
            error
        );


        result.innerText =
            "❌ Product tags generate नहीं हो सके.\n\n" +
            "Error: " +
            error.message;


        status.innerText =
            "Please try again.";

    }
    finally{

        button.disabled = false;

        button.innerText =
            "🤖 Generate AI Product Tags";

    }

}



/* =====================================
   STRICT LOCAL FILTER
===================================== */

function filterTags(
    text,
    product,
    brand,
    category,
    audience
){

    let lines =
        text
        .split(/\n/)
        .map(line =>
            line
            .replace(/^\s*[\d\-\.\)\:]+\s*/, "")
            .trim()
        )
        .filter(Boolean);


    /*
     * Remove markdown
     */

    lines =
        lines.map(tag =>
            tag
            .replace(/\*\*/g,"")
            .replace(/^["']|["']$/g,"")
            .trim()
        );


    /*
     * Remove duplicates
     */

    const unique = [];

    const seen = new Set();


    for(const tag of lines){

        const normalized =
            tag
            .toLowerCase()
            .replace(/[\s\-]+/g," ")
            .trim();


        if(seen.has(normalized)){
            continue;
        }


        seen.add(normalized);

        unique.push(tag);

    }


    /*
     * Build allowed words
     */

    const source =
        (
            product + " " +
            brand + " " +
            category + " " +
            audience
        )
        .toLowerCase();


    /*
     * Forbidden generic words
     */

    const forbidden = [

        "best",
        "premium",
        "amazing",
        "excellent",
        "luxury",
        "trending",
        "bestseller",
        "original",
        "high quality",

        "merchandise",
        "garment",
        "goods",
        "gear",
        "line",
        "range",
        "selection",
        "collection",

        "fashion",
        "style",
        "look",
        "wear",
        "apparel",

        "online",
        "store",
        "shopping",
        "sale",
        "offer",
        "buy",
        "shop"

    ];


    /*
     * Product type detection
     */

    const productLower =
        product.toLowerCase();


    const forbiddenProductTypes = [

        "shirt",
        "top",
        "polo",
        "dress",
        "hoodie",
        "sweater",
        "jacket",
        "jeans",
        "trouser"

    ];


    let filtered = [];


    for(const tag of unique){

        const lower =
            tag.toLowerCase();


        /*
         * Reject numbering
         */

        if(
            /^\d+[\.\)]/.test(tag)
        ){
            continue;
        }


        /*
         * Reject marketing words
         */

        let bad = false;


        for(const word of forbidden){

            if(
                lower.includes(word) &&
                !source.includes(word)
            ){

                bad = true;
                break;

            }

        }


        if(bad){
            continue;
        }


        /*
         * Check product type
         */

        for(
            const type
            of forbiddenProductTypes
        ){

            if(
                productLower.includes(type)
                &&
                type !== "shirt"
                &&
                lower.includes(type)
            ){

                /*
                 * allowed only if exact
                 * product information contains it
                 */

                continue;

            }

        }


        /*
         * Reject obviously unrelated
         * product type words
         */

        const productWords =
            productLower
            .split(/[\s\-]+/)
            .filter(Boolean);


        const tagHasProductWord =
            productWords.some(word =>
                word.length > 2 &&
                lower.includes(word)
            );


        const brandMatch =
            brand &&
            lower.includes(
                brand.toLowerCase()
            );


        const categoryMatch =
            category &&
            lower.includes(
                category.toLowerCase()
            );


        const audienceMatch =
            audience &&
            lower.includes(
                audience.toLowerCase()
            );


        /*
         * A valid tag should connect
         * to product information.
         */

        if(
            !tagHasProductWord &&
            !brandMatch &&
            !categoryMatch &&
            !audienceMatch
        ){

            continue;

        }


        /*
         * Remove spelling variations
         */

        const cleanKey =
            lower
            .replace(/tshirt/g,"t shirt")
            .replace(/t-shirt/g,"t shirt")
            .replace(/t shirt/g,"t shirt")
            .replace(/\s+/g," ")
            .trim();


        if(
            filtered.some(existing =>
                existing
                .toLowerCase()
                .replace(/tshirt/g,"t shirt")
                .replace(/t-shirt/g,"t shirt")
                .replace(/t shirt/g,"t shirt")
                .replace(/\s+/g," ")
                .trim()
                === cleanKey
            )
        ){

            continue;

        }


        filtered.push(tag);


        /*
         * Maximum 20
         */

        if(filtered.length >= 20){
            break;
        }

    }


    return filtered;

}



/* =====================================
   COPY TAGS
===================================== */

async function copyTags(){

    const result =
        document.getElementById("result");


    const text =
        result.innerText.trim();


    if(
        !text ||
        text ===
        "AI product tags will appear here..."
    ){

        alert(
            "पहले Product Tags generate करें।"
        );

        return;

    }


    if(
        text.startsWith("❌")
    ){

        alert(
            "पहले valid tags generate करें।"
        );

        return;

    }


    try{

        await navigator.clipboard
            .writeText(text);


        alert(
            "✅ Product Tags copied successfully!"
        );

    }
    catch(error){

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value = text;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();


        alert(
            "✅ Product Tags copied successfully!"
        );

    }

}

</script>


</body>

    </html>
