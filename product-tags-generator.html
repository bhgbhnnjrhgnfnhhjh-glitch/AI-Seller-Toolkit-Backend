/* =========================================
   EXTRACT TAGS
========================================= */

function extractTags(text){


    let lines =
        text
        .split(/\r?\n/)
        .map(
            line =>
            line.trim()
        )
        .filter(
            line =>
            line !== ""
        );


    const tags = [];


    for(let line of lines){


        /* Remove numbering */

        line =
            line.replace(
                /^\s*\d+[\.\)\-:]\s*/,
                ""
            );


        /* Remove bullets */

        line =
            line.replace(
                /^\s*[-*•]\s*/,
                ""
            );


        /* Remove hashtags */

        line =
            line.replace(
                /^#+/,
                ""
            );


        /* Remove quotes */

        line =
            line.replace(
                /^["'`]+|["'`]+$/g,
                ""
            );


        line =
            line.trim();



        if(line === ""){

            continue;

        }



        /*
         * Ignore accidental headings
         */

        const lower =
            line.toLowerCase();


        if(
            lower === "product tags" ||
            lower === "tags" ||
            lower === "product tag" ||
            lower === "seo tags"
        ){

            continue;

        }



        tags.push(line);

    }


    return tags;

}



/* =========================================
   STRICT FILTER
========================================= */

function strictFilterTags(
    tags,
    info
){


    const bannedWords = [

        "fashion",
        "style",
        "wear",
        "outfit",
        "look",
        "collection",
        "line",
        "range",
        "selection",
        "gear",
        "goods",
        "merchandise",
        "item",
        "product",
        "garment",
        "apparel",

        "online",
        "shopping",
        "store",
        "shop",
        "buy",

        "premium",
        "best",
        "excellent",
        "quality",
        "durable",
        "comfortable",
        "stylish",
        "luxury",
        "lightweight",
        "waterproof",

        "offer",
        "discount",
        "bestseller",
        "trending",
        "viral"

    ];



    const cleanProduct =
        normalizeText(
            info.product
        );


    const productWords =
        getWords(
            info.product
        );


    const brandWords =
        getWords(
            info.brand
        );


    const categoryWords =
        getWords(
            info.category
        );


    const materialWords =
        getWords(
            info.material
        );


    const colorWords =
        getWords(
            info.color
        );


    const audienceWords =
        getWords(
            info.audience
        );



    return tags.filter(
        tag => {


            const cleanTag =
                normalizeText(
                    tag
                );


            if(
                cleanTag === ""
            ){

                return false;

            }



            /* Too short */

            if(
                cleanTag.length < 2
            ){

                return false;

            }



            /* Banned word check */

            const tagWords =
                getWords(tag);


            for(
                const banned
                of bannedWords
            ){

                if(
                    tagWords.includes(
                        banned
                    )
                ){

                    return false;

                }

            }



            /*
             * Tag must contain
             * actual product information.
             */

            const allowedWords = [

                ...productWords,
                ...brandWords,
                ...categoryWords,
                ...materialWords,
                ...colorWords,
                ...audienceWords

            ];



            /*
             * If we have supplied information,
             * tag must overlap with it.
             */

            if(
                allowedWords.length > 0
            ){

                const hasRelevantWord =
                    tagWords.some(
                        word =>
                        allowedWords.includes(
                            word
                        )
                    );


                if(
                    !hasRelevantWord
                ){

                    return false;

                }

            }



            /*
             * Do not allow a tag that
             * completely changes product type.
             */

            if(
                productWords.length > 0
            ){

                const productTypeWords =
                    getProductCoreWords(
                        info.product
                    );


                const hasProductCore =
                    productTypeWords.some(
                        word =>
                        tagWords.includes(
                            word
                        )
                    );


                /*
                 * Brand-only tags are allowed.
                 */

                const isBrandOnly =
                    brandWords.length > 0 &&
                    brandWords.every(
                        word =>
                        tagWords.includes(
                            word
                        )
                    );


                if(
                    !hasProductCore &&
                    !isBrandOnly
                ){

                    return false;

                }

            }



            return true;

        }
    );

}



/* =========================================
   REMOVE DUPLICATE MEANING
========================================= */

function removeDuplicateMeaning(tags){


    const used = [];

    const result = [];


    for(
        const tag
        of tags
    ){


        const normalized =
            normalizeTagForComparison(
                tag
            );


        let duplicate =
            false;


        for(
            const previous
            of used
        ){


            if(
                normalized === previous
            ){

                duplicate = true;

                break;

            }

        }


        if(
            !duplicate
        ){

            used.push(
                normalized
            );

            result.push(
                tag
            );

        }

    }


    return result;

}



/* =========================================
   NORMALIZE TAG
========================================= */

function normalizeTagForComparison(
    text
){


    return getWords(text)
        .sort()
        .join(" ");

}



/* =========================================
   NORMALIZE TEXT
========================================= */

function normalizeText(text){


    return String(text || "")
        .toLowerCase()
        .replace(
            /[^a-z0-9\s]/g,
            " "
        )
        .replace(
            /\s+/g,
            " "
        )
        .trim();

}



/* =========================================
   GET WORDS
========================================= */

function getWords(text){


    return normalizeText(
        text
    )
    .split(" ")
    .filter(
        word =>
        word.length > 1
    );

}
