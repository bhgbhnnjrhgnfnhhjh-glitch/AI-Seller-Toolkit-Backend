<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Tags Generator</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
    max-width:700px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:0;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:disabled{
    opacity:0.6;
    cursor:not-allowed;
}

.copy-btn{
    background:#16a34a;
}

.clear-btn{
    background:#dc2626;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

#result{
    width:100%;
    min-height:350px;
    margin-top:15px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:10px;
    resize:vertical;
    font-size:16px;
    line-height:1.7;
    box-sizing:border-box;
}

.info{
    margin-top:15px;
    padding:12px;
    background:#f1f5f9;
    border-radius:8px;
    font-size:14px;
}

</style>

</head>


<body>


<header>

<h1>🏷️ AI Product Tags Generator</h1>

<a href="tools.html">⬅ Back to Tools</a>

</header>


<div class="container">

<div class="card">

<h2>Generate AI Product Tags</h2>


<label>Product Name *</label>

<input
type="text"
id="product"
placeholder="Example: Black Cotton T-Shirt"
>


<label>Brand Name</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud"
>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing"
>


<label>Material</label>

<input
type="text"
id="material"
placeholder="Example: 100% Cotton"
>


<label>Color</label>

<input
type="text"
id="color"
placeholder="Example: Black"
>


<label>Target Audience</label>

<input
type="text"
id="audience"
placeholder="Example: Men"
>


<button
id="generateBtn"
onclick="generateTags()"
>

🤖 Generate AI Product Tags

</button>


<div
id="status"
>
</div>


<div class="info">

<strong>Strict Filtering:</strong>

AI द्वारा बनाए गए tags में केवल दिए गए
Product, Brand, Category, Material, Color और
Audience से संबंधित शब्द रखे जाएंगे।

</div>


<textarea
id="result"
readonly
placeholder="AI generated product tags will appear here..."
></textarea>


<button
class="copy-btn"
onclick="copyTags()"
>

📋 Copy Tags

</button>


<button
class="clear-btn"
onclick="clearForm()"
>

🗑 Clear

</button>


</div>

</div>



<script>


/* =========================================
   BACKEND URL
========================================= */

const API_URL =
"https://ai-seller-toolkit-backend-1.onrender.com/generate";



/* =========================================
   GENERATE TAGS
========================================= */

async function generateTags(){

    const product =
        document.getElementById("product")
        .value
        .trim();

    const brand =
        document.getElementById("brand")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value
        .trim();

    const material =
        document.getElementById("material")
        .value
        .trim();

    const color =
        document.getElementById("color")
        .value
        .trim();

    const audience =
        document.getElementById("audience")
        .value
        .trim();


    const result =
        document.getElementById("result");

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("generateBtn");


    /* =====================================
       VALIDATION
    ===================================== */

    if(product === ""){

        alert("कृपया Product Name भरें।");

        return;

    }


    button.disabled = true;

    button.innerText =
        "⏳ AI Tags बनाए जा रहे हैं...";

    status.innerText =
        "AI से response लिया जा रहा है...";

    result.value =
        "⏳ Please wait...";


    /* =====================================
       AI PROMPT
    ===================================== */

    const prompt = `

You are a strict eCommerce product tag generator.

Generate exactly 20 product tags.

PRODUCT INFORMATION:

Product Name:
${product}

Brand:
${brand || "Not specified"}

Category:
${category || "Not specified"}

Material:
${material || "Not specified"}

Color:
${color || "Not specified"}

Target Audience:
${audience || "Not specified"}


STRICT RULES:

1. Generate exactly 20 unique product tags.

2. Every tag MUST describe the exact product.

3. Do not change the product type.

4. If the product is "Black Cotton T-Shirt",
you must keep the product type "T-Shirt".

5. Do NOT replace T-Shirt with:
Shirt
Top
Tee
Polo
Garment
Clothing
Apparel
Wear
Gear
Goods
Merchandise
Item
Product

6. Do NOT invent information.

7. Do NOT invent features.

8. Do NOT invent benefits.

9. Do NOT invent quality claims.

10. Do NOT use:
Premium
Best
Excellent
High Quality
Durable
Comfortable
Stylish
Luxury
Trending
Bestseller

unless explicitly supplied by the user.

11. Do not add unrelated words.

12. Do not create generic filler tags.

13. Do not use meaningless variations.

14. Do not create tags by simply adding words such as:
Fashion
Style
Look
Collection
Line
Range
Selection
Item
Product
Goods
Gear
Merchandise

unless those words are explicitly present
in the supplied information.

15. Use only words that are supported by the
provided product information.

16. Brand can only be used if supplied.

17. Material can only be used if supplied.

18. Color can only be used if supplied.

19. Audience can only be used if supplied.

20. Do not create fake search intent such as:
Buy
Shop
Online
Sale
Offer
Deal

unless the supplied information specifically
contains those words.

21. Do not use unrelated product categories.

22. Do not mention other brands.

23. Do not use numbers.

24. Do not use hashtags.

25. Do not add explanations.

26. Return ONLY the tags.

27. Return exactly 20 numbered lines.

FORMAT:

1. tag
2. tag
3. tag
4. tag
5. tag
6. tag
7. tag
8. tag
9. tag
10. tag
11. tag
12. tag
13. tag
14. tag
15. tag
16. tag
17. tag
18. tag
19. tag
20. tag

`;


    try{


        /* =====================================
           API REQUEST
        ===================================== */

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({

                        prompt:prompt

                    })

                }
            );


        /* =====================================
           RESPONSE JSON
        ===================================== */

        let data;

        try{

            data =
                await response.json();

        }catch(jsonError){

            throw new Error(
                "Backend ने valid JSON response नहीं दिया।"
            );

        }


        if(!response.ok){

            throw new Error(

                data.details ||
                data.error ||
                "Backend server error"

            );

        }


        if(
            !data.result ||
            !data.result.trim()
        ){

            throw new Error(
                "AI ने empty response दिया।"
            );

        }


        /* =====================================
           STRICT FILTER
        ===================================== */

        const filteredTags =
            strictFilterTags(
                data.result,
                product,
                brand,
                category,
                material,
                color,
                audience
            );


        if(filteredTags.length === 0){

            throw new Error(
                "Strict filtering के बाद कोई valid tag नहीं मिला।"
            );

        }


        result.value =
            filteredTags
            .map(
                (tag,index) =>
                (index + 1) + ". " + tag
            )
            .join("\n");


        status.innerText =
            "✅ " +
            filteredTags.length +
            " valid product tags तैयार हैं।";


    }catch(error){


        console.error(
            "Product Tags Error:",
            error
        );


        result.value =
            "❌ Product tags generate नहीं हो सके.\n\n" +
            "Error: " +
            error.message;


        status.innerText =
            "❌ Error आया है।";


    }finally{


        button.disabled =
            false;


        button.innerText =
            "🤖 Generate AI Product Tags";


    }

}



/* =========================================
   STRICT FILTER FUNCTION
========================================= */

function strictFilterTags(
    text,
    product,
    brand,
    category,
    material,
    color,
    audience
){


    /* -------------------------------------
       Convert response into lines
    ------------------------------------- */

    let lines =
        text
        .split(/\n/)
        .map(
            line =>
            line
            .replace(
                /^\s*\d+[\.\)\-:]\s*/,
                ""
            )
            .trim()
        )
        .filter(Boolean);


    /* -------------------------------------
       Remove hashtags / bullets
    ------------------------------------- */

    lines =
        lines.map(
            line =>
            line
            .replace(/^#+/, "")
            .trim()
        );


    /* -------------------------------------
       Remove duplicates
    ------------------------------------- */

    const unique =
        [];


    const seen =
        new Set();


    for(const tag of lines){

        const clean =
            tag
            .replace(/\s+/g," ")
            .trim();


        const key =
            clean.toLowerCase();


        if(
            clean &&
            !seen.has(key)
        ){

            seen.add(key);

            unique.push(clean);

        }

    }


    /* -------------------------------------
       Forbidden filler words
    ------------------------------------- */

    const forbidden = [

        "premium",
        "best",
        "excellent",
        "high quality",
        "durable",
        "comfortable",
        "stylish",
        "luxury",
        "trending",
        "bestseller",
        "fashion",
        "style",
        "look",
        "collection",
        "line",
        "range",
        "selection",
        "item",
        "product",
        "goods",
        "gear",
        "merchandise",
        "apparel",
        "garment",
        "wear",
        "clothing"

    ];


    /* -------------------------------------
       Words allowed from user input
    ------------------------------------- */

    const sourceText = (

        product + " " +
        brand + " " +
        category + " " +
        material + " " +
        color + " " +
        audience

    ).toLowerCase();


    const sourceWords =
        sourceText
        .split(/[^a-zA-Z0-9]+/)
        .filter(word => word.length > 1);


    /* -------------------------------------
       Product type protection
    ------------------------------------- */

    const productLower =
        product.toLowerCase();


    let productType = "";


    if(productLower.includes("t-shirt")){

        productType = "t-shirt";

    }
    else if(productLower.includes("tshirt")){

        productType = "tshirt";

    }
    else if(productLower.includes("shoes")){

        productType = "shoes";

    }
    else if(productLower.includes("shoe")){

        productType = "shoe";

    }
    else if(productLower.includes("dress")){

        productType = "dress";

    }
    else if(productLower.includes("jeans")){

        productType = "jeans";

    }
    else if(productLower.includes("watch")){

        productType = "watch";

    }
    else if(productLower.includes("bag")){

        productType = "bag";

    }


    /* -------------------------------------
       Final filtering
    ------------------------------------- */

    const valid = [];


    for(const tag of unique){

        const lower =
            tag.toLowerCase();


        /* Too long */

        if(tag.length > 80){

            continue;

        }


        /* Forbidden filler */

        let blocked =
            false;


        for(const word of forbidden){

            if(
                lower.includes(word) &&
                !sourceText.includes(word)
            ){

                blocked = true;

                break;

            }

        }


        if(blocked){

            continue;

        }


        /* ---------------------------------
           Check product type
        --------------------------------- */

        if(productType){

            if(
                !lower.includes(productType) &&
                !lower.includes(
                    productType.replace("-", "")
                )
            ){

                continue;

            }

        }


        /* ---------------------------------
           Check source words
        --------------------------------- */

        const tagWords =
            lower
            .split(/[^a-zA-Z0-9]+/)
            .filter(word => word.length > 1);


        let unknownCount = 0;


        for(const word of tagWords){

            if(
                !sourceWords.includes(word)
            ){

                unknownCount++;

            }

        }


        /*
         * Allow only a very small number
         * of unknown connector words.
         */

        if(unknownCount > 1){

            continue;

        }


        valid.push(tag);


        if(valid.length >= 20){

            break;

        }

    }


    return valid;

}



/* =========================================
   COPY TAGS
========================================= */

async function copyTags(){


    const result =
        document.getElementById("result");


    const text =
        result.value.trim();


    if(
        !text ||
        text.startsWith("❌") ||
        text.startsWith("⏳")
    ){

        alert(
            "पहले Product Tags generate करें।"
        );

        return;

    }


    try{

        await navigator.clipboard
            .writeText(text);


        alert(
            "✅ Product Tags copied successfully!"
        );


    }catch(error){


        const textarea =
            document.createElement("textarea");


        textarea.value =
            text;


        document.body
            .appendChild(textarea);


        textarea.select();


        document.execCommand("copy");


        textarea.remove();


        alert(
            "✅ Product Tags copied successfully!"
        );

    }

}



/* =========================================
   CLEAR
========================================= */

function clearForm(){


    document.getElementById("product")
        .value = "";


    document.getElementById("brand")
        .value = "";


    document.getElementById("category")
        .value = "";


    document.getElementById("material")
        .value = "";


    document.getElementById("color")
        .value = "";


    document.getElementById("audience")
        .value = "";


    document.getElementById("result")
        .value = "";


    document.getElementById("status")
        .innerText = "";

}

</script>


</body>

</html>
