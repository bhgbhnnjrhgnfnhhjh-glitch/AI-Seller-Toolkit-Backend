<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Product Tags Generator</title>

<link rel="stylesheet" href="style.css">

<style>

.tags-box {
    white-space: pre-wrap;
    line-height: 1.8;
    min-height: 280px;
}

.status {
    margin-top: 12px;
    text-align: center;
    font-size: 14px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

</style>

</head>


<body>


<header>

<h1>🏷 AI Product Tags Generator</h1>

<a href="tools.html">⬅ Back to Tools</a>

</header>



<div class="container">


<div class="card">

<h2>Generate AI Product Tags</h2>


<label>Product Name</label>

<input
    type="text"
    id="product"
    placeholder="Example: Black Cotton T-Shirt"
>



<label>Brand Name</label>

<input
    type="text"
    id="brand"
    placeholder="Example: Fashion Hud"
>



<label>Category</label>

<input
    type="text"
    id="category"
    placeholder="Example: Men's Clothing"
>



<button
    id="generateBtn"
    onclick="generateTags()"
>

🤖 Generate AI Product Tags

</button>


<div
    id="status"
    class="status"
></div>


</div>



<div class="card">


<h2>Generated Product Tags</h2>


<textarea
    id="result"
    class="tags-box"
    rows="20"
    readonly
    placeholder="Your AI product tags will appear here..."
></textarea>


<button
    onclick="copyTags()"
>

📋 Copy Tags

</button>


<button
    onclick="clearTags()"
>

🗑 Clear

</button>


</div>


</div>



<script>


/* =========================================
   BACKEND URL
========================================= */

const API_URL =
"https://ai-seller-toolkit-backend-1.onrender.com/generate";



/* =========================================
   GENERATE TAGS
========================================= */

async function generateTags() {


    const product =
        document
        .getElementById("product")
        .value
        .trim();


    const brand =
        document
        .getElementById("brand")
        .value
        .trim();


    const category =
        document
        .getElementById("category")
        .value
        .trim();


    const result =
        document.getElementById("result");


    const status =
        document.getElementById("status");


    const button =
        document.getElementById("generateBtn");



    /* =====================================
       VALIDATION
    ===================================== */

    if (product === "") {

        alert("कृपया Product Name भरें।");

        return;

    }



    button.disabled = true;

    button.innerText =
        "⏳ Generating...";


    status.innerText =
        "AI product tags बना रहा है...";


    result.value =
        "⏳ Please wait...";



    /* =====================================
       STRICT AI PROMPT
    ===================================== */

    const prompt = `

You are a STRICT eCommerce product tag generator.

Create product tags ONLY from the exact information supplied below.

PRODUCT NAME:
${product}

BRAND:
${brand || "Not specified"}

CATEGORY:
${category || "Not specified"}


===============================
STRICT PRODUCT PROTECTION
===============================

The PRODUCT NAME is the most important source.

You MUST preserve the exact product type.

If Product Name is:

Black Cotton T-Shirt

you may use:

Black Cotton T-Shirt
Black T-Shirt
Cotton T-Shirt
Black Cotton T-Shirt Online
Buy Black Cotton T-Shirt
Shop Black Cotton T-Shirt

But NEVER change the product into another product type.

DO NOT create:

Shirt
Polo Shirt
Top
Tee
Jeans
Pants
Dress
Jacket
Hoodie

unless that exact product type appears in the supplied Product Name.


===============================
STRICT BRAND RULE
===============================

Brand may ONLY be used if supplied.

Brand:
${brand || "Not specified"}

Never invent another brand.

Never add:

Nike
Adidas
Puma
Reebok
Samsung
Apple
etc.

unless supplied by the user.


===============================
STRICT CATEGORY RULE
===============================

Category:
${category || "Not specified"}

Category words may only be used when they clearly describe the exact supplied product.

Do NOT convert:

Men's Clothing

into:

Men T-Shirt
Men's T-Shirt
Man T-Shirt

unless the Product Name itself contains that information.


===============================
FORBIDDEN WORDS
===============================

Do NOT add marketing words such as:

Best
Premium
Original
Amazing
Excellent
Quality
Luxury
Superior
Trending
Bestseller
Popular
Stylish
Beautiful
Perfect
Durable
Comfortable
Soft
Lightweight
High Quality
Guaranteed


Do NOT add:

Fashion
Style
Wear
Outfit
Look
Collection
Line
Range
Selection
Product
Item
Garment
Merchandise
Goods
Gear

unless the exact word is already part of the supplied product information.


===============================
TAG RULES
===============================

1. Generate exactly 20 tags.

2. Every tag must be directly related to the exact Product Name.

3. Use only supplied information.

4. Do not invent specifications.

5. Do not invent benefits.

6. Do not invent colors.

7. Do not invent material.

8. Do not invent gender.

9. Do not invent size.

10. Do not invent product type.

11. Do not add unrelated words.

12. Do not repeat the same tag.

13. Different capitalization does NOT make a new tag.

For example:

Black Cotton T-Shirt
black cotton t-shirt

are duplicates.

14. Keep the exact product type.

15. Tags may include natural search phrases such as:

[Product]
[Product] Online
Buy [Product]
Shop [Product]

ONLY when they remain accurate.

16. Do not use hashtags.

17. Do not number the tags.

18. Return ONLY the tags.

19. Put each tag on a separate line.

20. Do not add explanations.


===============================
FINAL VALIDATION
===============================

Before returning each tag:

CHECK 1:
Does the tag describe the exact product?

CHECK 2:
Does it contain only supplied information?

CHECK 3:
Did it change the product type?

CHECK 4:
Did it add an unsupported feature?

CHECK 5:
Did it add a forbidden marketing word?

CHECK 6:
Is it a duplicate?

If ANY answer is YES, REMOVE the tag.


===============================
OUTPUT
===============================

Return exactly 20 valid product tags.

Format:

1. Tag
2. Tag
3. Tag

Do not write anything before or after the list.

`;



    try {


        /* =================================
           API REQUEST
        ================================= */

        const response =
            await fetch(
                API_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        prompt: prompt
                    })
                }
            );



        const data =
            await response.json();



        if (!response.ok) {

            throw new Error(
                data.details ||
                data.error ||
                "Server error"
            );

        }



        if (
            !data.result ||
            !data.result.trim()
        ) {

            throw new Error(
                "AI returned an empty response."
            );

        }



        /* =================================
           STRICT LOCAL FILTER
        ================================= */

        const tags =
            strictFilterTags(
                data.result,
                product,
                brand,
                category
            );



        if (tags.length === 0) {

            throw new Error(
                "AI ने कोई valid product tag नहीं बनाया।"
            );

        }



        /* =================================
           DISPLAY
        ================================= */

        result.value =
            tags
            .map(
                function(tag, index) {

                    return (
                        (index + 1) +
                        ". " +
                        tag
                    );

                }
            )
            .join("\n");



        status.innerText =
            "✅ " +
            tags.length +
            " valid product tags generated.";



    } catch (error) {


        console.error(
            "Product Tags Error:",
            error
        );


        result.value =
            "❌ Product tags generate नहीं हो सके.\n\n" +
            "Error: " +
            error.message;


        status.innerText =
            "Please try again.";


    } finally {


        button.disabled = false;

        button.innerText =
            "🤖 Generate AI Product Tags";

    }

}



/* =========================================
   STRICT LOCAL FILTER
========================================= */

function strictFilterTags(
    text,
    product,
    brand,
    category
) {


    /* -------------------------------------
       Convert input to lowercase
    ------------------------------------- */

    const productLower =
        product
        .toLowerCase()
        .trim();


    const brandLower =
        brand
        .toLowerCase()
        .trim();


    const categoryLower =
        category
        .toLowerCase()
        .trim();



    /* -------------------------------------
       Get product words
    ------------------------------------- */

    const productWords =
        productLower
        .replace(
            /[^a-z0-9\s-]/gi,
            " "
        )
        .split(/\s+/)
        .filter(Boolean);



    /* -------------------------------------
       Forbidden words
    ------------------------------------- */

    const forbiddenWords = [

        "best",
        "premium",
        "original",
        "amazing",
        "excellent",
        "quality",
        "luxury",
        "superior",
        "trending",
        "bestseller",
        "popular",
        "stylish",
        "beautiful",
        "perfect",
        "durable",
        "comfortable",
        "soft",
        "lightweight",
        "high quality",
        "guaranteed",

        "fashion",
        "style",
        "wear",
        "outfit",
        "look",
        "collection",
        "line",
        "range",
        "selection",
        "garment",
        "merchandise",
        "goods",
        "gear",

        "man",
        "men",
        "mens",
        "women",
        "womens",

        "shirt",
        "top",
        "tee",
        "polo",
        "jeans",
        "pants",
        "dress",
        "jacket",
        "hoodie"

    ];



    /* -------------------------------------
       Remove numbering
    ------------------------------------- */

    let lines =
        text
        .split(/\r?\n/)
        .map(
            function(line) {

                return line
                    .replace(
                        /^\s*\d+[\.\)\-:]\s*/,
                        ""
                    )
                    .trim();

            }
        )
        .filter(Boolean);



    const finalTags = [];



    /* =====================================
       PROCESS EACH TAG
    ===================================== */

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {


        let tag =
            lines[i]
            .replace(
                /^["'`]+|["'`]+$/g,
                ""
            )
            .trim();



        if (!tag) {
            continue;
        }



        /* ---------------------------------
           Remove hashtags
        --------------------------------- */

        tag =
            tag.replace(
                /#/g,
                ""
            );



        /* ---------------------------------
           Remove excessive spaces
        --------------------------------- */

        tag =
            tag.replace(
                /\s+/g,
                " "
            )
            .trim();



        const lower =
            tag.toLowerCase();



        /* ---------------------------------
           Duplicate check
        --------------------------------- */

        if (
            finalTags.some(
                function(existing) {

                    return (
                        existing
                        .toLowerCase() ===
                        lower
                    );

                }
            )
        ) {

            continue;

        }



        /* ---------------------------------
           Forbidden word check
        --------------------------------- */

        let forbidden =
            false;


        for (
            let j = 0;
            j < forbiddenWords.length;
            j++
        ) {


            const word =
                forbiddenWords[j];


            const regex =
                new RegExp(
                    "\\b" +
                    word.replace(
                        /[.*+?^${}()|[\]\\]/g,
                        "\\$&"
                    ) +
                    "\\b",
                    "i"
                );


            if (
                regex.test(lower) &&
                !productLower.includes(word)
            ) {

                forbidden = true;

                break;

            }

        }



        if (forbidden) {
            continue;
        }



        /* ---------------------------------
           Product identity check
        --------------------------------- */

        let hasProductWord =
            false;


        for (
            let j = 0;
            j < productWords.length;
            j++
        ) {

            if (
                lower.includes(
                    productWords[j]
                )
            ) {

                hasProductWord = true;

                break;

            }

        }



        if (!hasProductWord) {

            continue;

        }



        /* ---------------------------------
           Allowed suffixes
        --------------------------------- */

        const allowedExtraWords = [

            "online",
            "buy",
            "shop",
            "store",
            "shopping"

        ];



        const tagWords =
            lower
            .split(/\s+/)
            .filter(Boolean);



        let validWords =
            true;



        for (
            let j = 0;
            j < tagWords.length;
            j++
        ) {


            const word =
                tagWords[j];


            const cleanWord =
                word.replace(
                    /[^a-z0-9-]/gi,
                    ""
                );


            const isProductWord =
                productWords.includes(
                    cleanWord
                );


            const isBrandWord =
                brandLower &&
                brandLower
                .split(/\s+/)
                .includes(
                    cleanWord
                );


            const isAllowedExtra =
                allowedExtraWords.includes(
                    cleanWord
                );


            if (
                !isProductWord &&
                !isBrandWord &&
                !isAllowedExtra
            ) {

                /*
                 * Category words are allowed only
                 * if they already appear in product.
                 */

                if (
                    !productLower.includes(
                        cleanWord
                    )
                ) {

                    validWords = false;

                    break;

                }

            }

        }



        if (!validWords) {
            continue;
        }



        /* ---------------------------------
           Clean final tag
        --------------------------------- */

        tag =
            tag.replace(
                /\s+/g,
                " "
            )
            .trim();



        if (
            tag.length < 2 ||
            tag.length > 80
        ) {

            continue;

        }



        finalTags.push(tag);



        /* Maximum 20 */
        if (
            finalTags.length >= 20
        ) {

            break;

        }

    }



    return finalTags;

}



/* =========================================
   COPY TAGS
========================================= */

async function copyTags() {


    const result =
        document.getElementById("result");


    const text =
        result.value.trim();



    if (
        text === "" ||
        text.startsWith("⏳") ||
        text.startsWith("❌")
    ) {

        alert(
            "पहले Product Tags generate करें।"
        );

        return;

    }



    try {


        await navigator
            .clipboard
            .writeText(text);


        alert(
            "✅ Product Tags copied successfully!"
        );


    } catch (error) {


        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value = text;


        document
            .body
            .appendChild(textarea);


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();


        alert(
            "✅ Product Tags copied successfully!"
        );

    }

}



/* =========================================
   CLEAR
========================================= */

function clearTags() {


    document
        .getElementById("product")
        .value = "";


    document
        .getElementById("brand")
        .value = "";


    document
        .getElementById("category")
        .value = "";


    document
        .getElementById("result")
        .value = "";


    document
        .getElementById("status")
        .innerText = "";

}


</script>


</body>

</html>
