<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    min-height:100vh;
}

header{
    background:linear-gradient(90deg,#2563eb,#4f46e5);
    color:white;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    color:white;
    cursor:pointer;
}

.generate{
    background:#16a34a;
}

.generate:hover{
    background:#15803d;
}

.download{
    background:#2563eb;
    display:none;
}

.clear{
    background:#dc2626;
    display:none;
}

/* QR BOX */

.qr-wrapper{
    display:none;
    margin-top:25px;
    padding:25px;
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    justify-content:center;
    align-items:center;
}

/*
   Important:
   QR के चारों तरफ white space रखा गया है।
*/

#qrcode{
    background:white;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:center;
}

#qrcode canvas{
    display:block;
    width:300px !important;
    height:300px !important;
}

#qrcode img{
    display:block;
    width:300px !important;
    height:300px !important;
}

.message{
    text-align:center;
    margin-top:15px;
    color:#555;
    font-size:14px;
    line-height:1.6;
}

.instructions{
    margin-top:20px;
    padding:15px;
    background:#f1f5f9;
    border-radius:10px;
    color:#444;
    font-size:14px;
    line-height:1.7;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;
}

</style>

</head>


<body>


<header>
📱 QR Code Generator
</header>


<div class="container">

<h2>Generate QR Code</h2>


<label for="qrText">
Enter Text / URL
</label>


<input
    type="text"
    id="qrText"
    placeholder="https://example.com"
    autocomplete="off"
>


<button
    class="generate"
    onclick="generateQR()">

    📱 Generate QR Code

</button>


<div
    class="qr-wrapper"
    id="qrWrapper">

    <div id="qrcode"></div>

</div>


<p
    class="message"
    id="message">
</p>


<button
    class="download"
    id="downloadBtn"
    onclick="downloadQR()">

    ⬇️ Download QR Code

</button>


<button
    class="clear"
    id="clearBtn"
    onclick="clearQR()">

    🗑️ Clear

</button>


<div class="instructions">

<strong>How to test:</strong>

<br>

1. Enter a website URL or text.

<br>

2. Press Generate QR Code.

<br>

3. Scan the QR using your phone camera.

<br>

4. The original URL or text should appear.

</div>


<div class="footer">

Generate QR codes for Text, Links and URLs

</div>


</div>


<script>

let qrGenerated = false;


/* =========================
   GENERATE QR
========================= */

function generateQR(){

    const text =
        document
        .getElementById("qrText")
        .value
        .trim();


    const qrContainer =
        document
        .getElementById("qrcode");


    const qrWrapper =
        document
        .getElementById("qrWrapper");


    const downloadBtn =
        document
        .getElementById("downloadBtn");


    const clearBtn =
        document
        .getElementById("clearBtn");


    const message =
        document
        .getElementById("message");


    if(text === ""){

        alert("Please enter text or URL.");

        return;
    }


    /* पुराने QR को हटाएं */

    qrContainer.innerHTML = "";


    message.innerText = "";


    try{

        new QRCode(qrContainer, {

            text: text,

            width: 300,

            height: 300,

            colorDark: "#000000",

            colorLight: "#ffffff",

            correctLevel: QRCode.CorrectLevel.M

        });


        qrGenerated = true;


        qrWrapper.style.display = "flex";

        downloadBtn.style.display = "block";

        clearBtn.style.display = "block";


        message.innerText =
            "✅ QR Code successfully generated. अब इसे Camera से scan करें।";

    }

    catch(error){

        console.error(error);


        qrGenerated = false;


        message.innerText =
            "❌ QR Code generate नहीं हो पाया।";

    }

}


/* =========================
   DOWNLOAD QR
========================= */

function downloadQR(){

    if(!qrGenerated){

        alert("पहले QR Code Generate करें.");

        return;
    }


    const canvas =
        document.querySelector("#qrcode canvas");


    const img =
        document.querySelector("#qrcode img");


    let imageURL = "";


    if(canvas){

        imageURL =
            canvas.toDataURL("image/png");

    }

    else if(img){

        imageURL =
            img.src;

    }

    else{

        alert("QR Code image नहीं मिली.");

        return;
    }


    const link =
        document.createElement("a");


    link.href = imageURL;

    link.download = "AI-Seller-Toolkit-QRCode.png";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}


/* =========================
   CLEAR QR
========================= */

function clearQR(){

    document
        .getElementById("qrText")
        .value = "";


    document
        .getElementById("qrcode")
        .innerHTML = "";


    document
        .getElementById("message")
        .innerText = "";


    document
        .getElementById("qrWrapper")
        .style.display = "none";


    document
        .getElementById("downloadBtn")
        .style.display = "none";


    document
        .getElementById("clearBtn")
        .style.display = "none";


    qrGenerated = false;

}

</script>


</body>

</html>
