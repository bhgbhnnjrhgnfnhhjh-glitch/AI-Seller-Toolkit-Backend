<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Code Generator</title>

<!-- QR Code Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    min-height:100vh;
}

header{
    background:linear-gradient(90deg,#2563eb,#4f46e5);
    color:white;
    padding:18px;
    text-align:center;
    font-size:23px;
    font-weight:bold;
}

.container{
    width:92%;
    max-width:600px;
    margin:30px auto;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 5px 18px rgba(0,0,0,.12);
    margin-bottom:20px;
}

h2{
    text-align:center;
    color:#2563eb;
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.generate{
    background:#16a34a;
}

.download{
    background:#2563eb;
    display:none;
}

.clear{
    background:#dc2626;
    display:none;
}

.status{
    text-align:center;
    margin-top:15px;
    font-size:15px;
    color:#333;
}

/* QR AREA */

.qr-area{
    display:none;
    margin-top:20px;
    text-align:center;
}

.qr-box{
    display:inline-block;
    background:#ffffff;
    padding:25px;
    border:1px solid #ddd;
    border-radius:12px;
}

/*
Important:
QR के चारों तरफ सफेद जगह रखी गई है।
*/

#qrcode{
    width:300px;
    height:300px;
    background:white;
}

#qrcode canvas{
    display:block;
    width:300px !important;
    height:300px !important;
}

#qrcode img{
    display:block;
    width:300px !important;
    height:300px !important;
}

.scan-message{
    margin-top:15px;
    padding:12px;
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    border-radius:8px;
    color:#166534;
    font-size:14px;
}

.info{
    margin-top:20px;
    padding:15px;
    background:#f8fafc;
    border-radius:10px;
    font-size:14px;
    line-height:1.7;
    color:#555;
}

</style>

</head>


<body>


<header>
📱 QR Code Generator
</header>


<div class="container">


<!-- GENERATOR CARD -->

<div class="card">

<h2>Generate QR Code</h2>


<label for="qrText">
Text / URL
</label>


<input
    type="text"
    id="qrText"
    placeholder="https://example.com"
    autocomplete="off"
>


<button
    class="generate"
    onclick="generateQR()">

    📱 Generate QR Code

</button>


<div
    class="status"
    id="status">
</div>


</div>


<!-- QR RESULT -->

<div
    class="card qr-area"
    id="qrArea">


<h2>
Your QR Code
</h2>


<div class="qr-box">

<div id="qrcode"></div>

</div>


<div class="scan-message">

✅ QR Code Ready to Scan

<br>

Use your phone Camera or QR Scanner.

</div>


<button
    class="download"
    id="downloadBtn"
    onclick="downloadQR()">

    ⬇️ Download QR Code

</button>


<button
    class="clear"
    id="clearBtn"
    onclick="clearQR()">

    🗑️ Clear QR Code

</button>


</div>


<!-- INFORMATION -->

<div class="card info">

<strong>How to use:</strong>

<br><br>

1. Enter a URL or text.

<br>

2. Press Generate QR Code.

<br>

3. QR Code will appear.

<br>

4. Scan it using your phone Camera or QR Scanner.

<br>

5. Use Download to save the QR image.

</div>


</div>


<script>

/* =====================================
   QR GENERATOR
===================================== */

let qrReady = false;


function generateQR(){

    const input =
        document.getElementById("qrText");

    const text =
        input.value.trim();


    const qr =
        document.getElementById("qrcode");


    const qrArea =
        document.getElementById("qrArea");


    const status =
        document.getElementById("status");


    const downloadBtn =
        document.getElementById("downloadBtn");


    const clearBtn =
        document.getElementById("clearBtn");


    /* Empty check */

    if(text === ""){

        status.innerText =
            "❌ Please enter text or URL.";

        status.style.color = "#dc2626";

        input.focus();

        return;

    }


    /* Clear previous QR */

    qr.innerHTML = "";


    try{

        /*
        Error correction M gives
        good balance between size
        and scanning reliability.
        */

        new QRCode(qr,{

            text:text,

            width:300,

            height:300,

            colorDark:"#000000",

            colorLight:"#ffffff",

            correctLevel:QRCode.CorrectLevel.M

        });


        qrReady = true;


        qrArea.style.display = "block";

        downloadBtn.style.display = "block";

        clearBtn.style.display = "block";


        status.innerText =
            "✅ QR Code successfully generated.";

        status.style.color = "#15803d";


    }

    catch(error){

        console.error(error);


        qrReady = false;


        status.innerText =
            "❌ QR Code generate नहीं हो पाया.";

        status.style.color = "#dc2626";

    }

}


/* =====================================
   DOWNLOAD
===================================== */

function downloadQR(){

    if(!qrReady){

        alert("पहले QR Code Generate करें.");

        return;

    }


    const canvas =
        document.querySelector(
            "#qrcode canvas"
        );


    const image =
        document.querySelector(
            "#qrcode img"
        );


    let url = "";


    if(canvas){

        url =
            canvas.toDataURL(
                "image/png"
            );

    }

    else if(image){

        url =
            image.src;

    }

    else{

        alert("QR image नहीं मिली.");

        return;

    }


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "AI-Seller-Toolkit-QR-Code.png";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);

}


/* =====================================
   CLEAR
===================================== */

function clearQR(){

    document
        .getElementById("qrText")
        .value = "";


    document
        .getElementById("qrcode")
        .innerHTML = "";


    document
        .getElementById("qrArea")
        .style.display = "none";


    document
        .getElementById("downloadBtn")
        .style.display = "none";


    document
        .getElementById("clearBtn")
        .style.display = "none";


    document
        .getElementById("status")
        .innerText = "";


    qrReady = false;

}

</script>


</body>

</html>
