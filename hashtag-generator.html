<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Hashtag Generator — Final Version 9.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#18202a}
.container{max-width:760px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin-top:0}
label{display:block;font-weight:700;margin:16px 0 7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d6dbe3;border-radius:10px;font-size:15px}
textarea{min-height:110px;resize:vertical}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#111827;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.status{margin-top:14px;font-size:14px}
.result{margin-top:20px;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;white-space:pre-wrap;line-height:1.8}
.small{font-size:12px;color:#64748b;margin-top:10px}
.version{font-size:12px;color:#64748b}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🏷️ AI Hashtag Generator</h1>
<div class="version">FINAL VERSION 9.0 — Locked Seller-Phrase Engine</div>

<label for="category">Category</label>
<select id="category">
<option>Fashion</option>
<option>Beauty</option>
<option>Electronics</option>
<option>Home & Kitchen</option>
<option>Shoes</option>
<option>Jewellery</option>
<option>Toys</option>
<option>Books</option>
<option>Pet</option>
<option>Sports</option>
<option>Automotive</option>
<option>Garden</option>
<option>Food</option>
<option>Gifts</option>
</select>

<label for="productName">Product Name *</label>
<input id="productName" placeholder="e.g. Black Cotton T-Shirt">

<label for="brand">Brand</label>
<input id="brand" placeholder="e.g. TestBrand">

<label for="details">Product Details</label>
<textarea id="details" placeholder="e.g. Black cotton, round neck"></textarea>

<label for="keywords">Important Keywords</label>
<input id="keywords" placeholder="e.g. cotton t-shirt, black t-shirt">

<button id="generateBtn">✨ Generate Hashtags</button>
<div id="status" class="status"></div>
<div id="result" class="result" style="display:none"></div>
<div class="small">Only seller-provided phrases are used. AI-generated random combinations are never displayed.</div>
</div>
</div>

<script>
const API_BASE = "https://ai-seller-toolkit-backend-1.onrender.com";
const VERSION = "9.0";

const STOP = new Set([
"the","a","an","and","or","with","for","of","to","by","in","on","is","are",
"this","that","product","item","new","best","good","high","quality","pack",
"set","piece","pieces","size","colour","color","brand","model"
]);

function cleanText(v){
  return String(v || "")
    .replace(/[•|/\\()[\]{}"'“”‘’]+/g," ")
    .replace(/[,:;!?]+/g,",")
    .replace(/\s+/g," ")
    .trim();
}

function words(v){
  return cleanText(v)
    .toLowerCase()
    .replace(/[^a-z0-9\u0900-\u097f\s,-]/gi," ")
    .split(/[\s,]+/)
    .map(x=>x.trim())
    .filter(Boolean);
}

function titleCaseToken(s){
  return s.split(/(\s+)/).map(x=>{
    if(!x.trim()) return x;
    return x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();
  }).join("");
}

function hashtagFromPhrase(phrase){
  const ws = words(phrase).filter(w=>!STOP.has(w));
  if(!ws.length) return "";
  return "#" + ws.map(w=>titleCaseToken(w)).join("");
}

function normalizeKey(s){
  return String(s).toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g,"");
}

function addCandidate(list, seen, phrase, sourceWords){
  phrase = cleanText(phrase).replace(/^[-–—]+|[-–—]+$/g,"").trim();
  if(!phrase) return;

  const pWords = words(phrase);
  if(!pWords.length || pWords.length > 6) return;
  if(pWords.some(w=>STOP.has(w))) return;

  const tag = hashtagFromPhrase(phrase);
  if(!tag) return;

  // No one-word hashtags. This blocks #Black, #Cotton, #Round, etc.
  if(pWords.length < 2) return;

  const key = normalizeKey(tag);
  if(seen.has(key)) return;

  // Only accept phrases that occur contiguously in seller text,
  // OR a tightly controlled "detail + product type" phrase.
  const source = sourceWords.map(x=>normalizeKey(x));
  const target = pWords.map(x=>normalizeKey(x));

  let contiguous = false;
  for(let i=0;i<=source.length-target.length;i++){
    if(target.every((w,j)=>source[i+j]===w)){ contiguous=true; break; }
  }
  if(!contiguous) return;

  seen.add(key);
  list.push(tag);
}

function extractPhrases(text){
  const result=[];
  const cleaned=cleanText(text);
  if(!cleaned) return result;

  cleaned.split(/[.!?]+/).forEach(sentence=>{
    sentence.split(/\s*,\s*|\s*;\s*/).forEach(part=>{
      const p=part.trim();
      if(p) result.push(p);
    });
  });
  return result;
}

function buildHashtags(){
  const product = cleanText(document.getElementById("productName").value);
  const brand = cleanText(document.getElementById("brand").value);
  const details = cleanText(document.getElementById("details").value);
  const keywords = cleanText(document.getElementById("keywords").value);

  if(!product){
    throw new Error("Please enter Product Name.");
  }

  // Seller text only. No AI output is used.
  const allText = [product, details, keywords].filter(Boolean).join(" ");
  const sourceWords = words(allText);

  const candidates=[];
  const seen=new Set();

  // 1) Exact multi-word phrases from comma/semicolon-separated seller details.
  [...extractPhrases(product), ...extractPhrases(details), ...extractPhrases(keywords)]
    .forEach(p=>addCandidate(candidates,seen,p,sourceWords));

  // 2) Product-name contiguous n-grams, longest first.
  const productWords = words(product);
  for(let n=Math.min(5,productWords.length); n>=2; n--){
    for(let i=0;i<=productWords.length-n;i++){
      addCandidate(candidates,seen,productWords.slice(i,i+n).join(" "),sourceWords);
    }
  }

  // 3) Details contiguous n-grams, max 3 words, to avoid junk combinations.
  const detailWords = words(details);
  for(let n=Math.min(3,detailWords.length); n>=2; n--){
    for(let i=0;i<=detailWords.length-n;i++){
      addCandidate(candidates,seen,detailWords.slice(i,i+n).join(" "),sourceWords);
    }
  }

  // 4) Keywords contiguous n-grams.
  const keyWords = words(keywords);
  for(let n=Math.min(4,keyWords.length); n>=2; n--){
    for(let i=0;i<=keyWords.length-n;i++){
      addCandidate(candidates,seen,keyWords.slice(i,i+n).join(" "),sourceWords);
    }
  }

  // 5) Brand only if seller supplied it; brands are intentionally allowed
  // as a special one-token exception.
  if(brand){
    const brandClean=cleanText(brand);
    const brandTag=hashtagFromPhrase(brandClean);
    const bk=normalizeKey(brandTag);
    if(brandTag && !seen.has(bk)){
      seen.add(bk);
      candidates.unshift(brandTag);
    }
  }

  // Final safety: no duplicate normalized words inside a hashtag.
  const final=[];
  for(const tag of candidates){
    const tw=tag.slice(1).split(/(?=[A-Z])/).filter(Boolean).map(x=>x.toLowerCase());
    if(tw.length && new Set(tw).size===tw.length){
      final.push(tag);
    }
    if(final.length>=12) break;
  }

  return final.slice(0,12);
}

async function callBackend(){
  // Backend is contacted to keep the API connection alive/verified,
  // but its generated hashtag text is NEVER trusted or displayed.
  try{
    const res=await fetch(API_BASE+"/api/generate-hashtags",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        category:document.getElementById("category").value,
        productName:document.getElementById("productName").value.trim(),
        brand:document.getElementById("brand").value.trim(),
        details:document.getElementById("details").value.trim(),
        keywords:document.getElementById("keywords").value.trim(),
        version:VERSION
      })
    });
    return res.ok;
  }catch(e){
    return false;
  }
}

document.getElementById("generateBtn").addEventListener("click", async ()=>{
  const btn=document.getElementById("generateBtn");
  const status=document.getElementById("status");
  const result=document.getElementById("result");

  btn.disabled=true;
  status.textContent="Generating safe hashtags…";
  result.style.display="none";

  try{
    const local=buildHashtags();

    // API call is optional; local locked engine remains authoritative.
    await callBackend();

    if(!local.length){
      throw new Error("Please provide at least two-word product/detail phrases.");
    }

    result.textContent=local.join(" ");
    result.style.display="block";
    status.textContent=`✅ Generated ${local.length} safe hashtags — Version ${VERSION}`;
  }catch(err){
    status.textContent="❌ "+err.message;
  }finally{
    btn.disabled=false;
  }
});
</script>
</body>
</html>
