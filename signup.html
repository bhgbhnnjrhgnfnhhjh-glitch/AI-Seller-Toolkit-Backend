<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up - AI Seller Toolkit</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:#f3f6fb;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.signup-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:10px;
}

.icon{
    text-align:center;
    font-size:40px;
    margin-bottom:5px;
}

h2{
    text-align:center;
    color:#222;
    margin-bottom:25px;
}

label{
    display:block;
    margin:15px 0 7px;
    font-weight:bold;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#9ca3af;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
    min-height:25px;
}

.login-link{
    text-align:center;
    margin-top:22px;
}

.login-link a{
    color:#2563eb;
    font-weight:bold;
    text-decoration:none;
}

.home-link{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#555;
    text-decoration:none;
}

@media(max-width:480px){
    .signup-box{
        padding:24px 20px;
    }
}
</style>
</head>

<body>

<div class="signup-box">

    <div class="icon">📝</div>

    <div class="logo">
        🤖 AI Seller Toolkit
    </div>

    <h2>Create Account</h2>

    <form id="signupForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button
            type="submit"
            id="signupBtn"
        >
            📝 Create Account
        </button>

    </form>

    <div id="message" class="message"></div>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="home-link">
        ← Back to Home
    </a>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


/* Firebase Configuration */

const firebaseConfig = {

    apiKey: "AIzaSyCRFKO2RT8cyoKoNR3wWdEaQHZIezQf1Ns",

    authDomain:
        "ai-seller-toolkit.firebaseapp.com",

    projectId:
        "ai-seller-toolkit",

    storageBucket:
        "ai-seller-toolkit.firebasestorage.app",

    messagingSenderId:
        "49741472114",

    appId:
        "1:49741472114:web:95c5b95d79d0f023a3bdeb"
};


/* Start Firebase */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


/* Get HTML Elements */

const form =
    document.getElementById("signupForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const button =
    document.getElementById("signupBtn");

const message =
    document.getElementById("message");


/* Signup */

form.addEventListener("submit", async function(event){

    event.preventDefault();

    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;

    const confirmValue =
        confirmPassword.value;


    /* Check password */

    if(passwordValue.length < 6){

        message.style.color = "#dc2626";

        message.innerText =
            "❌ Password कम से कम 6 characters का होना चाहिए।";

        return;
    }


    /* Check confirm password */

    if(passwordValue !== confirmValue){

        message.style.color = "#dc2626";

        message.innerText =
            "❌ दोनों Password समान नहीं हैं।";

        return;
    }


    button.disabled = true;

    button.innerText =
        "⏳ Creating Account...";

    message.innerText = "";


    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
            );


        console.log(
            "Firebase User:",
            userCredential.user
        );


        message.style.color =
            "#16a34a";

        message.innerText =
            "✅ Account successfully created!";


        button.innerText =
            "✅ Account Created";


        /* Go to home */

        setTimeout(function(){

            window.location.href =
                "index.html";

        },1500);


    }

    catch(error){

        console.error(
            "Firebase Signup Error:",
            error
        );


        message.style.color =
            "#dc2626";


        if(error.code ===
            "auth/email-already-in-use"){

            message.innerText =
                "❌ इस Email से account पहले से बना हुआ है।";

        }

        else if(error.code ===
            "auth/invalid-email"){

            message.innerText =
                "❌ Email सही नहीं है।";

        }

        else if(error.code ===
            "auth/weak-password"){

            message.innerText =
                "❌ Password बहुत कमजोर है।";

        }

        else if(error.code ===
            "auth/network-request-failed"){

            message.innerText =
                "❌ Internet connection की समस्या है।";

        }

        else if(error.code ===
            "auth/operation-not-allowed"){

            message.innerText =
                "❌ Firebase में Email/Password Login Enabled नहीं है।";

        }

        else{

            message.innerText =
                "❌ Firebase Error: " +
                error.code +
                " | " +
                error.message;
        }


        button.disabled = false;

        button.innerText =
            "📝 Create Account";
    }

});

</script>

</body>
</html>
