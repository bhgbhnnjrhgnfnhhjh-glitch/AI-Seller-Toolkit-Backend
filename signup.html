<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Signup - AI Seller Toolkit</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #f3f4f6;
}

header {
    background: #2563eb;
    color: white;
    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.home-link {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

main {
    min-height: calc(100vh - 60px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.signup-box {
    width: 100%;
    max-width: 420px;

    background: white;

    padding: 30px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.10);
}

.icon {
    text-align: center;
    font-size: 42px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;

    color: #2563eb;

    font-size: 25px;

    margin-bottom: 25px;
}

label {
    display: block;

    margin-top: 15px;
    margin-bottom: 7px;

    font-weight: bold;

    color: #333;
}

input {
    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.signup-btn {
    width: 100%;

    margin-top: 24px;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #16a34a;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.signup-btn:disabled {
    background: #9ca3af;

    cursor: not-allowed;
}

.message {
    min-height: 24px;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;

    line-height: 1.5;
}

.login-link {
    text-align: center;

    margin-top: 22px;

    color: #555;

    font-size: 14px;
}

.login-link a {
    color: #2563eb;

    text-decoration: none;

    font-weight: bold;
}

.back-home {
    display: block;

    text-align: center;

    margin-top: 18px;

    color: #555;

    text-decoration: none;

    font-size: 14px;
}

@media (max-width: 480px) {

    header {
        padding: 14px;
    }

    .logo {
        font-size: 17px;
    }

    .home-link {
        font-size: 12px;
    }

    .signup-box {
        padding: 25px 20px;
    }

}

</style>

</head>


<body>


<header>

    <div class="logo">
        🤖 AI Seller Toolkit
    </div>

    <a
        href="index.html"
        class="home-link"
    >
        ← Back to Home
    </a>

</header>


<main>

<div class="signup-box">

    <div class="icon">
        📝
    </div>

    <h1>
        Create Account
    </h1>


    <form id="signupForm">


        <label for="email">
            Email
        </label>

        <input
            type="text"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
            required
        >


        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            required
        >


        <button
            type="submit"
            id="signupBtn"
            class="signup-btn"
        >
            📝 Create Account
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>


</div>

</main>


<script type="module">

import {
    auth,
    createUserWithEmailAndPassword
} from "./firebase-config.js";


const form =
    document.getElementById("signupForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const signupBtn =
    document.getElementById("signupBtn");

const message =
    document.getElementById("message");


function showError(text) {

    message.style.color = "#dc2626";

    message.textContent = text;
}


function showSuccess(text) {

    message.style.color = "#16a34a";

    message.textContent = text;
}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        const confirmPassword =
            confirmPasswordInput.value;


        /* Check Email */

        if (!email) {

            showError(
                "❌ कृपया Email डालें।"
            );

            emailInput.focus();

            return;
        }


        /* Simple Email Check */

        if (
            !email.includes("@") ||
            !email.includes(".")
        ) {

            showError(
                "❌ कृपया सही Email डालें।"
            );

            emailInput.focus();

            return;
        }


        /* Check Password */

        if (password.length < 6) {

            showError(
                "❌ Password कम से कम 6 characters का होना चाहिए।"
            );

            passwordInput.focus();

            return;
        }


        /* Check Confirm Password */

        if (password !== confirmPassword) {

            showError(
                "❌ दोनों Password एक जैसे नहीं हैं।"
            );

            confirmPasswordInput.focus();

            return;
        }


        signupBtn.disabled = true;

        signupBtn.textContent =
            "⏳ Account बन रहा है...";

        message.textContent = "";


        try {

            const result =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "Firebase Signup Success:",
                result.user
            );


            showSuccess(
                "✅ Account सफलतापूर्वक बन गया!"
            );


            form.reset();


            /*
             * profile.html पर नहीं भेजेंगे।
             * क्योंकि अभी profile.html उपलब्ध नहीं है।
             */

            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                1200
            );


        }

        catch(error) {

            console.error(
                "Firebase Signup Error:",
                error
            );


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                showError(
                    "❌ इस Email से Account पहले से बना हुआ है।"
                );

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                showError(
                    "❌ Email सही नहीं है।"
                );

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                showError(
                    "❌ Password बहुत कमजोर है। कम से कम 6 characters रखें।"
                );

            }

            else if (
                error.code ===
                "auth/operation-not-allowed"
            ) {

                showError(
                    "❌ Firebase में Email/Password Login बंद है।"
                );

            }

            else {

                showError(
                    "❌ Signup Error: " +
                    error.message
                );

            }

        }

        finally {

            signupBtn.disabled = false;

            signupBtn.textContent =
                "📝 Create Account";

        }

    }
);

</script>


</body>

</html>
