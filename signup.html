<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up - AI Seller Toolkit</title><style>

/* ==============================
   RESET
============================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


/* ==============================
   BODY
============================== */

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #eef4ff,
            #f8fbff
        );

    font-family:
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


/* ==============================
   SIGNUP BOX
============================== */

.signup-box {

    width: 100%;

    max-width: 430px;

    background: #ffffff;

    padding: 30px;

    border-radius: 18px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.12);

}


/* ==============================
   LOGO
============================== */

.logo {

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    color: #2563eb;

    margin-bottom: 8px;

}


/* ==============================
   TITLE
============================== */

h2 {

    text-align: center;

    color: #222222;

    font-size: 24px;

    margin-bottom: 25px;

}


/* ==============================
   LABEL
============================== */

label {

    display: block;

    font-size: 14px;

    font-weight: bold;

    color: #333333;

    margin-top: 15px;

    margin-bottom: 7px;

}


/* ==============================
   INPUT
============================== */

input {

    width: 100%;

    height: 48px;

    padding:
        0 13px;

    border:
        1px solid #cccccc;

    border-radius: 8px;

    font-size: 16px;

    outline: none;

    background: #ffffff;

}


input:focus {

    border-color: #2563eb;

    box-shadow:
        0 0 0 2px
        rgba(37, 99, 235, 0.10);

}


/* ==============================
   CREATE ACCOUNT BUTTON
============================== */

#signupBtn {

    display: block;

    width: 100%;

    min-height: 50px;

    margin-top: 24px;

    border: none;

    border-radius: 9px;

    background: #16a34a;

    color: #ffffff;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


#signupBtn:hover {

    background: #15803d;

}


#signupBtn:active {

    transform: scale(0.99);

}


#signupBtn:disabled {

    background: #9ca3af;

    cursor: not-allowed;

    transform: none;

}


/* ==============================
   MESSAGE
============================== */

.message {

    width: 100%;

    min-height: 22px;

    text-align: center;

    margin-top: 15px;

    font-size: 14px;

    line-height: 1.5;

}


/* ==============================
   LOGIN LINK
============================== */

.login-link {

    text-align: center;

    margin-top: 20px;

    color: #444444;

    font-size: 14px;

}


.login-link a {

    color: #2563eb;

    text-decoration: none;

    font-weight: bold;

}


.login-link a:hover {

    text-decoration: underline;

}


/* ==============================
   HOME LINK
============================== */

.home-link {

    display: block;

    text-align: center;

    margin-top: 18px;

    color: #555555;

    text-decoration: none;

    font-size: 14px;

}


.home-link:hover {

    color: #2563eb;

}


/* ==============================
   MOBILE
============================== */

@media
(max-width: 480px) {

    body {

        padding: 15px;

    }


    .signup-box {

        padding: 24px 20px;

        border-radius: 15px;

    }


    .logo {

        font-size: 22px;

    }


    h2 {

        font-size: 22px;

    }

}


/* ==============================
   SMALL MOBILE
============================== */

@media
(max-width: 350px) {

    .signup-box {

        padding: 20px 15px;

    }


    .logo {

        font-size: 20px;

    }


    h2 {

        font-size: 20px;

    }

}

</style></head><body><!-- ==============================
     SIGNUP BOX
============================== --><div class="signup-box"><!-- LOGO -->

<div class="logo">

    🤖 AI Seller Toolkit

</div>


<!-- TITLE -->

<h2>

    Create Account

</h2>


<!-- ==============================
     SIGNUP FORM
=============================== -->

<form
    id="signupForm"
    novalidate
>


    <!-- EMAIL -->

    <label
        for="email"
    >

        Email

    </label>


    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
    >


    <!-- PASSWORD -->

    <label
        for="password"
    >

        Password

    </label>


    <input
        type="password"
        id="password"
        name="password"
        placeholder="Minimum 6 characters"
        autocomplete="new-password"
        minlength="6"
        required
    >


    <!-- CONFIRM PASSWORD -->

    <label
        for="confirmPassword"
    >

        Confirm Password

    </label>


    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Enter password again"
        autocomplete="new-password"
        minlength="6"
        required
    >


    <!-- ==============================
         CREATE ACCOUNT BUTTON
    =============================== -->

    <button
        type="submit"
        id="signupBtn"
    >

        Create Account

    </button>


</form>


<!-- MESSAGE -->

<div
    id="message"
    class="message"
    aria-live="polite"
></div>


<!-- LOGIN -->

<div class="login-link">

    Already have an account?

    <a
        href="login.html"
    >

        Login

    </a>

</div>


<!-- HOME -->

<a
    href="index.html"
    class="home-link"
>

    ← Back to Home

</a>

</div><!-- ==============================
     FIREBASE SIGNUP
============================== --><script type="module">


import {

    auth,

    createUserWithEmailAndPassword

} from "./firebase-config.js";



/* ==============================
   GET ELEMENTS
============================== */

const signupForm =
    document.getElementById(
        "signupForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const signupBtn =
    document.getElementById(
        "signupBtn"
    );


const message =
    document.getElementById(
        "message"
    );



/* ==============================
   SHOW MESSAGE
============================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;


    if (
        type === "success"
    ) {

        message.style.color =
            "#16a34a";

    }

    else {

        message.style.color =
            "#dc2626";

    }

}



/* ==============================
   SIGNUP
============================== */

signupForm.addEventListener(

    "submit",

    async function(event) {


        event.preventDefault();


        /* --------------------------
           GET VALUES
        --------------------------- */

        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;



        /* --------------------------
           CLEAR MESSAGE
        --------------------------- */

        message.textContent =
            "";



        /* --------------------------
           CHECK EMAIL
        --------------------------- */

        if (!email) {

            showMessage(
                "❌ कृपया Email डालें।",
                "error"
            );

            emailInput.focus();

            return;

        }



        /* --------------------------
           CHECK PASSWORD
        --------------------------- */

        if (
            password.length < 6
        ) {

            showMessage(
                "❌ Password कम से कम 6 characters का होना चाहिए।",
                "error"
            );

            passwordInput.focus();

            return;

        }



        /* --------------------------
           CHECK CONFIRM PASSWORD
        --------------------------- */

        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "❌ दोनों Password एक जैसे नहीं हैं।",
                "error"
            );

            confirmPasswordInput.focus();

            return;

        }



        /* --------------------------
           DISABLE BUTTON
        --------------------------- */

        signupBtn.disabled =
            true;


        signupBtn.textContent =
            "⏳ Creating Account...";



        try {


            /* ----------------------
               CREATE FIREBASE USER
            ----------------------- */

            await createUserWithEmailAndPassword(

                auth,

                email,

                password

            );



            /* ----------------------
               SUCCESS
            ----------------------- */

            showMessage(

                "✅ Account successfully created! अब Login करें।",

                "success"

            );


            signupForm.reset();



            /*
             * IMPORTANT:
             *
             * profile.html पर redirect
             * नहीं किया जा रहा है।
             *
             * क्योंकि अभी आपके project
             * में profile.html नहीं है।
             *
             * Signup के बाद सीधे
             * login.html खुलेगा।
             */


            setTimeout(

                function() {

                    window.location.href =
                        "login.html";

                },

                1200

            );


        }


        catch(error) {


            console.error(
                "Firebase Signup Error:",
                error
            );



            /* ----------------------
               FIREBASE ERRORS
            ----------------------- */

            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                showMessage(

                    "❌ इस Email से Account पहले से बना हुआ है। Login करें।",

                    "error"

                );

            }


            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                showMessage(

                    "❌ Email सही नहीं है।",

                    "error"

                );

            }


            else if (
                error.code ===
                "auth/weak-password"
            ) {

                showMessage(

                    "❌ Password बहुत कमजोर है।",

                    "error"

                );

            }


            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                showMessage(

                    "❌ Internet connection check करें।",

                    "error"

                );

            }


            else {

                showMessage(

                    "❌ Account नहीं बन पाया। Firebase error: " +
                    error.message,

                    "error"

                );

            }

        }


        finally {


            signupBtn.disabled =
                false;


            signupBtn.textContent =
                "Create Account";

        }


    }

);

</script></body></html>
