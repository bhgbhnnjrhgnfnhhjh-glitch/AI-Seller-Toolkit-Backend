<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sign Up - AI Seller Toolkit</title><style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background: #f4f7fb;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}

.signup-box {

    width: 100%;

    max-width: 420px;

    background: white;

    padding: 30px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);

}

.logo {

    text-align: center;

    font-size: 28px;

    font-weight: bold;

    color: #2563eb;

    margin-bottom: 10px;

}

h2 {

    text-align: center;

    margin-bottom: 25px;

    color: #222;

}

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 7px;

    font-weight: bold;

}

input {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

    outline: none;

}

input:focus {

    border-color: #2563eb;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 22px;

    border: none;

    border-radius: 8px;

    background: #16a34a;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}

button:disabled {

    background: #9ca3af;

    cursor: not-allowed;

}

.message {

    text-align: center;

    margin-top: 15px;

    font-size: 14px;

    min-height: 20px;

}

.login-link {

    text-align: center;

    margin-top: 20px;

}

.login-link a {

    color: #2563eb;

    text-decoration: none;

    font-weight: bold;

}

.home-link {

    display: block;

    text-align: center;

    margin-top: 15px;

    color: #555;

    text-decoration: none;

}

</style></head><body><div class="signup-box"><div class="logo">🤖 AI Seller Toolkit

</div><h2>
Create Account
</h2><form id="signupForm"><label for="email">
Email
</label><input
type="email"
id="email"
placeholder="Enter your email"
autocomplete="email"
required

«»

<label for="password">
Password
</label><input
type="password"
id="password"
placeholder="Minimum 6 characters"
autocomplete="new-password"
minlength="6"
required

«»

<label for="confirmPassword">
Confirm Password
</label><input
type="password"
id="confirmPassword"
placeholder="Enter password again"
autocomplete="new-password"
minlength="6"
required

«»

<button
type="submit"
id="signupBtn"

«»

Create Account

</button></form><div
class="message"
id="message"
></div><div class="login-link">Already have an account?

<a href="login.html">
Login
</a></div><a
class="home-link"
href="index.html"

«»

← Back to Home

</a></div><script type="module">


import {

    auth,

    createUserWithEmailAndPassword

} from "./firebase-config.js";


const signupForm =
    document.getElementById("signupForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const confirmPasswordInput =
    document.getElementById("confirmPassword");


const signupBtn =
    document.getElementById("signupBtn");


const message =
    document.getElementById("message");


signupForm.addEventListener(

    "submit",

    async function(event) {


        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        message.innerText = "";


        if (!email) {

            message.style.color =
                "#dc2626";

            message.innerText =
                "❌ Please enter your email.";

            return;

        }


        if (
            password.length < 6
        ) {

            message.style.color =
                "#dc2626";

            message.innerText =
                "❌ Password कम से कम 6 characters का होना चाहिए।";

            return;

        }


        if (
            password !== confirmPassword
        ) {

            message.style.color =
                "#dc2626";

            message.innerText =
                "❌ Password और Confirm Password अलग हैं।";

            return;

        }


        signupBtn.disabled =
            true;


        signupBtn.innerText =
            "⏳ Creating Account...";


        try {


            await createUserWithEmailAndPassword(

                auth,

                email,

                password

            );


            message.style.color =
                "#16a34a";


            message.innerText =
                "✅ Account successfully created!";


            /*
            =====================================
            IMPORTANT
            =====================================

            profile.html मौजूद नहीं है।

            इसलिए Signup के बाद सीधे
            login.html पर भेज रहे हैं।

            =====================================
            */


            setTimeout(

                function() {


                    window.location.href =
                        "login.html";


                },

                1000

            );


        }


        catch(error) {


            console.error(
                "Signup Error:",
                error
            );


            message.style.color =
                "#dc2626";


            switch(error.code) {


                case
                "auth/email-already-in-use":


                    message.innerText =
                        "❌ इस Email से account पहले से बना हुआ है।";

                    break;


                case
                "auth/invalid-email":


                    message.innerText =
                        "❌ Email सही नहीं है।";

                    break;


                case
                "auth/weak-password":


                    message.innerText =
                        "❌ Password बहुत कमजोर है।";

                    break;


                case
                "auth/network-request-failed":


                    message.innerText =
                        "❌ Internet connection check करें।";

                    break;


                default:


                    message.innerText =
                        "❌ Account नहीं बन पाया: " +
                        error.message;

            }


        }


        finally {


            signupBtn.disabled =
                false;


            signupBtn.innerText =
                "Create Account";


        }


    }

);

</script></body></html>
