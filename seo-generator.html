<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI SEO Keyword Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🤖 AI Seller Toolkit</h1>

<a href="tools.html">⬅ Back</a>

</header>


<section class="hero">

<h2>🔍 AI SEO Keyword Generator</h2>

<p>Generate Powerful SEO Keywords for Your Products</p>

</section>


<section class="tools">

<div class="card">

<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Example: Cotton T-Shirt">


<br><br>


<label>Category</label>

<input
type="text"
id="category"
placeholder="Example: Men's Clothing">


<br><br>


<label>Brand Name</label>

<input
type="text"
id="brand"
placeholder="Example: Fashion Hud">


<br><br>


<label>Main Keyword</label>

<input
type="text"
id="keyword"
placeholder="Example: Black Cotton T-Shirt">


<br><br>


<label>Target Marketplace</label>

<select id="marketplace">

<option value="Amazon">Amazon</option>

<option value="Flipkart">Flipkart</option>

<option value="Meesho">Meesho</option>

<option value="Shopify">Shopify</option>

<option value="Etsy">Etsy</option>

<option value="All Marketplaces">
All Marketplaces
</option>

</select>


<br><br>


<button onclick="generateSEO()">

🤖 Generate SEO Keywords

</button>


<br><br>


<h3>🔍 Generated SEO Keywords</h3>

<textarea
id="result"
rows="15"
style="width:100%;"
readonly
placeholder="Your AI generated SEO keywords will appear here...">
</textarea>


<br><br>


<button onclick="copySEO()">

📋 Copy Keywords

</button>

</div>

</section>


<script src="seo-generator.js"></script>


</body>

</html>
