
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Keyword Generator</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    margin:0;
}

header{
    background:#0066cc;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    max-width:600px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

#result{
    margin-top:20px;
    background:#f8f8f8;
    padding:15px;
    border-radius:8px;
    white-space:pre-line;
}
</style>

</head>

<body>

<header>
<h2>🔍 SEO Keyword Generator</h2>
</header>

<div class="container">

<label>Product Name</label>

<input
type="text"
id="product"
placeholder="Enter Product Name">

<button onclick="generateSEO()">
Generate SEO Keywords
</button>

<div id="result"></div>

</div>

<script>

function generateSEO(){

let product=document.getElementById("product").value.trim();

if(product==""){

alert("Please enter product name");

return;

}

let keywords=`
${product}
Buy ${product} Online
Best ${product}
Cheap ${product}
${product} Price
${product} India
Latest ${product}
Top Quality ${product}
Original ${product}
${product} for Men
${product} for Women
`;

document.getElementById("result").innerHTML=
"<h3>SEO Keywords</h3>"+keywords;

}

</script>

</body>
  </html>
