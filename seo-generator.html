<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AI SEO Keyword Generator</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

.seo-box{
    max-width:700px;
    margin:30px auto;
    padding:25px;
    background:white;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.seo-box label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

.seo-box input,
.seo-box select,
.seo-box textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
    box-sizing:border-box;
}

.seo-box button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:7px;
    background:#16a34a;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.seo-box button:hover{
    background:#15803d;
}

.seo-box button:disabled{
    background:#999;
    cursor:not-allowed;
}

#result{
    margin-top:15px;
    min-height:250px;
    line-height:1.8;
    resize:vertical;
}

#status{
    margin-top:12px;
    text-align:center;
    font-weight:bold;
}

.copy-button{
    background:#2563eb !important;
}

.copy-button:hover{
    background:#1d4ed8 !important;
}

</style>

</head>


<body>


<header>

<h1>🤖 AI Seller Toolkit</h1>

<a href="tools.html">⬅ Back</a>

</header>


<section class="hero">

<h2>🔍 AI SEO Keyword Generator</h2>

<p>
Generate Relevant SEO Keywords for Your Products
</p>

</section>


<div class="seo-box">


<!-- PRODUCT NAME -->

<label>
Product Name
</label>

<input
    type="text"
    id="product"
    placeholder="Example: Cotton Kurti"
>


<!-- CATEGORY -->

<label>
Category
</label>

<select id="category">

<option value="">
Select Category
</option>

<option value="Fashion">
👗 Fashion
</option>

<option value="Beauty">
💄 Beauty
</option>

<option value="Electronics">
📱 Electronics
</option>

<option value="Home & Kitchen">
🏠 Home & Kitchen
</option>

<option value="Shoes">
👟 Shoes
</option>

<option value="Jewellery">
💍 Jewellery
</option>

<option value="Toys">
🧸 Toys
</option>

<option value="Books">
📚 Books
</option>

<option value="Pet">
🐶 Pet
</option>

<option value="Sports">
🏋️ Sports
</option>

<option value="Automotive">
🚗 Automotive
</option>

<option value="Garden">
🌱 Garden
</option>

<option value="Food">
🍎 Food
</option>

<option value="Gifts">
🎁 Gifts
</option>

</select>


<!-- BRAND -->

<label>
Brand Name
</label>

<input
    type="text"
    id="brand"
    placeholder="Example: Test Brand"
>

<!-- MAIN KEYWORD -->

<label>
Main Keyword
</label>

<input
    type="text"
    id="keyword"
    placeholder="Optional — खाली छोड़ने पर Product Name इस्तेमाल होगा"
>

<!-- MARKETPLACE -->

<label>
Target Marketplace
</label>

<select id="marketplace">

<option value="Amazon">
Amazon
</option>

<option value="Flipkart">
Flipkart
</option>

<option value="Meesho">
Meesho
</option>

<option value="Shopify">
Shopify
</option>

<option value="Etsy">
Etsy
</option>

<option value="All Marketplaces">
All Marketplaces
</option>

</select>


<!-- GENERATE -->

<button
    id="generateBtn"
    type="button"
>

🤖 Generate SEO Keywords

</button>


<div id="status"></div>


<!-- RESULT -->

<label>
Generated SEO Keywords
</label>

<textarea
    id="result"
    readonly
    placeholder="Your AI SEO keywords will appear here..."
></textarea>


<!-- COPY -->

<button
    id="copyBtn"
    class="copy-button"
    type="button"
>

📋 Copy Keywords

</button>


</div>

<script src="seo-keyword-generator.js"></script>

<script
    src="no-popup.js"
></script>


</body>

</html>
