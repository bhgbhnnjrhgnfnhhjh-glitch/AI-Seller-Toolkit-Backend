<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - AI Seller Toolkit</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #f3f4f6;
}

header {
    background: #2563eb;
    color: white;
    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.home-link {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

main {
    min-height: calc(100vh - 60px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;

    background: white;

    padding: 30px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px rgba(0,0,0,0.10);
}

.icon {
    text-align: center;
    font-size: 45px;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    color: #2563eb;
    font-size: 24px;
    margin-bottom: 25px;
}

label {
    display: block;

    margin-top: 15px;
    margin-bottom: 7px;

    font-weight: bold;
    color: #333;
}

input {
    width: 100%;

    padding: 13px;

    border: 1px solid #d1d5db;

    border-radius: 8px;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;

    right: 8px;
    top: 50%;

    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: #2563eb;

    font-weight: bold;

    cursor: pointer;
}

.login-btn {
    width: 100%;

    margin-top: 22px;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #2563eb;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.login-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.forgot {
    text-align: right;
    margin-top: 12px;
}

.forgot button {
    border: none;

    background: transparent;

    color: #2563eb;

    font-size: 14px;

    cursor: pointer;
}

.message {
    min-height: 24px;

    margin-top: 15px;

}

.signup {
    text-align: center;

    margin-top: 22px;

}

.signup a {
    color: #2563eb;

    font-weight: bold;
}

    display: block;

    text-align: center;

    color: #555;

@media (max-width: 480px) {

    header {
        padding: 14px;
    }

    .logo {
        font-size: 17px;
    }

    .home-link {
        font-size: 12px;
    }

    .login-box {

    }

</style>

</head>


<body>


<header>

    <div class="logo">
        🤖 AI Seller Toolkit
    </div>

    <a
        href="index.html"
        class="home-link"
    >
        ← Back to Home
    </a>

</header>


<main>

<div class="login-box">

    <div class="icon">
        🔐
    </div>

    <h1>
        Login to Your Account
    </h1>


    <form id="loginForm">


        <label for="email">
            Email
        </label>

        <input
    type="text"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>


        <label for="password">
            Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                id="showPassword"
                class="show-btn"
            >
                Show
            </button>

        </div>


        <div class="forgot">

            <button
                type="button"
                id="forgotPassword"
            >
                Forgot Password?
            </button>

        </div>


        <button
            type="submit"
            id="loginBtn"
            class="login-btn"
        >
            🔐 Login
        </button>


    </form>


    <div
        id="message"
        class="message"
    ></div>


    <div class="signup">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>


</div>

</main>


<script type="module">

import {
    auth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "./firebase-config.js";


const form =
    document.getElementById("loginForm");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");

const showPassword =
    document.getElementById("showPassword");

const forgotPassword =
    document.getElementById("forgotPassword");



/* SHOW / HIDE PASSWORD */

showPassword.addEventListener(
    "click",
    function () {

        if (password.type === "password") {

            password.type = "text";

            showPassword.textContent = "Hide";

        } else {

            password.type = "password";

            showPassword.textContent = "Show";

        }

    }
);



/* LOGIN */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const userEmail =
            email.value.trim();

        const userPassword =
            password.value;


        if (!userEmail || !userPassword) {

            message.style.color = "#dc2626";

            message.textContent =
                "❌ Email और Password भरें।";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
            "⏳ Login हो रहा है...";

        message.textContent = "";


        try {

            const result =
                await signInWithEmailAndPassword(
                    auth,
                    userEmail,
                    userPassword
                );


            console.log(
                "Login successful:",
                result.user.email
            );


            message.style.color =
                "#16a34a";

            message.textContent =
                "✅ Login सफल हुआ!";


            setTimeout(
                function () {

                    window.location.href =
                        "index.html";

                },
                700
            );


        }

        catch (error) {

            console.error(
                "Firebase Login Error:",
                error
            );


            message.style.color =
                "#dc2626";


            switch (error.code) {

                case "auth/invalid-credential":

                    message.textContent =
                        "❌ Email या Password गलत है।";

                    break;


                case "auth/user-not-found":

                    message.textContent =
                        "❌ यह Email Firebase में नहीं मिला।";

                    break;


                case "auth/wrong-password":

                    message.textContent =
                        "❌ Password गलत है।";

                    break;


                case "auth/invalid-email":

                    message.textContent =
                        "❌ Email सही नहीं है।";

                    break;


                case "auth/too-many-requests":

                    message.textContent =
                        "❌ बहुत बार कोशिश हुई है। कुछ समय बाद दोबारा कोशिश करें।";

                    break;


                default:

                    message.textContent =
                        "❌ Login नहीं हो पाया। कृपया दोबारा कोशिश करें।";

            }

        }


        finally {

            loginBtn.disabled = false;

            loginBtn.textContent =
                "🔐 Login";

        }

    }
);



/* FORGOT PASSWORD */

forgotPassword.addEventListener(
    "click",
    async function () {

        const userEmail =
            email.value.trim();


        if (!userEmail) {

            message.style.color =
                "#dc2626";

            message.textContent =
                "❌ पहले Email डालें।";

            email.focus();

            return;
        }


        try {

            await sendPasswordResetEmail(
                auth,
                userEmail
            );


            message.style.color =
                "#16a34a";

            message.textContent =
                "✅ Password reset link आपके Email पर भेज दिया गया है।";

        }

        catch (error) {

            console.error(
                "Password Reset Error:",
                error
            );


            message.style.color =
                "#dc2626";


            switch (error.code) {

                case "auth/user-not-found":

                    message.textContent =
                        "❌ इस Email से कोई account नहीं मिला।";

                    break;


                case "auth/invalid-email":

                    message.textContent =
                        "❌ Email सही नहीं है।";

                    break;


                default:

                    message.textContent =
                        "❌ Password reset नहीं हो पाया।";

            }

        }

    }
);

</script>


</body>

</html>
