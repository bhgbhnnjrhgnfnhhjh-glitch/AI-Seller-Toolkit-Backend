<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - AI Seller Toolkit</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: #f3f4f6;
}

header {
    background: #2563eb;
    color: white;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 19px;
    font-weight: bold;
}

.home-link {
    color: white;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
}

main {
    min-height: calc(100vh - 55px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: white;
    padding: 30px 25px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
}

.icon {
    text-align: center;
    font-size: 44px;
    margin-bottom: 8px;
}

h1 {
    text-align: center;
    color: #2563eb;
    font-size: 23px;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #2563eb;
    font-weight: bold;
    cursor: pointer;
}

.forgot {
    text-align: right;
    margin-top: 10px;
}

.forgot button {
    border: none;
    background: transparent;
    color: #2563eb;
    font-size: 13px;
    cursor: pointer;
}

.login-btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.message {
    min-height: 25px;
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    font-weight: bold;
}

.signup {
    text-align: center;
    margin-top: 22px;
    color: #555;
    font-size: 14px;
}

.signup a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.back-home {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #555;
    text-decoration: none;
    font-size: 14px;
}

@media (max-width: 480px) {
    header {
        padding: 13px;
    }

    .logo {
        font-size: 16px;
    }

    .home-link {
        font-size: 11px;
    }

    .login-box {
        padding: 25px 20px;
    }
}
</style></head><body><header><div class="logo">
    🤖 AI Seller Toolkit
</div>

<a href="index.html" class="home-link">
    ← Back to Home
</a>

</header><main><div class="login-box"><div class="icon">
    🔐
</div>

<h1>
    Login to Your Account
</h1>

<form id="loginForm">

    <label for="email">
        Email
    </label>

    <input
        type="text"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        autocapitalize="none"
        spellcheck="false"
        required
    >

    <label for="password">
        Password
    </label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <button
            type="button"
            id="showPassword"
            class="show-btn"
        >
            Show
        </button>

    </div>

    <div class="forgot">

        <button
            type="button"
            id="forgotPassword"
        >
            Forgot Password?
        </button>

    </div>

    <button
        type="submit"
        id="loginBtn"
        class="login-btn"
    >
        🔐 Login
    </button>

</form>

<div id="message" class="message"></div>

<div class="signup">

    Don't have an account?

    <a href="signup.html">
        Create Account
    </a>

</div>

<a
    href="index.html"
    class="back-home"
>
    ← Back to Home
</a>

</div></main><script type="module">

/*
========================================
FIREBASE LOGIN
========================================
*/

import {
    auth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "./firebase-config.js";


/*
========================================
GET HTML ELEMENTS
========================================
*/

const form = document.getElementById("loginForm");

const emailInput = document.getElementById("email");

const passwordInput = document.getElementById("password");

const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");

const showPassword = document.getElementById("showPassword");

const forgotPassword = document.getElementById("forgotPassword");


/*
========================================
MESSAGE FUNCTION
========================================
*/

function showMessage(text, color) {

    message.textContent = text;

    message.style.color = color;

}


/*
========================================
SHOW / HIDE PASSWORD
========================================
*/

showPassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

        showPassword.textContent = "Hide";

    } else {

        passwordInput.type = "password";

        showPassword.textContent = "Show";

    }

});


/*
========================================
LOGIN
========================================
*/

form.addEventListener("submit", async function (event) {

    event.preventDefault();

    const userEmail = emailInput.value.trim();

    const userPassword = passwordInput.value;


    /*
    CHECK EMAIL
    */

    if (!userEmail) {

        showMessage(
            "❌ कृपया Email डालें।",
            "#dc2626"
        );

        emailInput.focus();

        return;
    }


    /*
    CHECK EMAIL FORMAT
    */

    if (
        !userEmail.includes("@") ||
        !userEmail.includes(".")
    ) {

        showMessage(
            "❌ कृपया सही Email डालें।",
            "#dc2626"
        );

        emailInput.focus();

        return;
    }


    /*
    CHECK PASSWORD
    */

    if (!userPassword) {

        showMessage(
            "❌ कृपया Password डालें।",
            "#dc2626"
        );

        passwordInput.focus();

        return;
    }


    /*
    LOGIN BUTTON
    */

    loginBtn.disabled = true;

    loginBtn.textContent = "⏳ Login हो रहा है...";

    showMessage("", "#000000");


    try {

        /*
        FIREBASE LOGIN
        */

        const result =
            await signInWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );


        console.log(
            "Firebase Login Success:",
            result.user.email
        );


        showMessage(
            "✅ Login सफल हुआ!",
            "#16a34a"
        );


        /*
        SAVE LOGIN STATUS
        */

        localStorage.setItem(
            "userLoggedIn",
            "true"
        );

        localStorage.setItem(
            "userEmail",
            result.user.email
        );


        /*
        GO TO WEBSITE
        */

        setTimeout(function () {

            window.location.href = "index.html";

        }, 800);


    } catch (error) {

        console.error(
            "Firebase Login Error:",
            error
        );


        /*
        FIREBASE ERRORS
        */

        if (
            error.code === "auth/invalid-credential"
        ) {

            showMessage(
                "❌ Email या Password गलत है।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/invalid-email"
        ) {

            showMessage(
                "❌ Email सही नहीं है।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/user-not-found"
        ) {

            showMessage(
                "❌ यह Email Firebase में नहीं मिला।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/wrong-password"
        ) {

            showMessage(
                "❌ Password गलत है।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/too-many-requests"
        ) {

            showMessage(
                "❌ बहुत बार Login कोशिश हुई है। थोड़ी देर बाद दोबारा कोशिश करें।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/network-request-failed"
        ) {

            showMessage(
                "❌ Internet connection की समस्या है।",
                "#dc2626"
            );

        }

        else {

            showMessage(
                "❌ Login नहीं हो पाया। Error: " +
                error.code,
                "#dc2626"
            );

        }

    }


    /*
    ENABLE BUTTON AGAIN
    */

    finally {

        loginBtn.disabled = false;

        loginBtn.textContent = "🔐 Login";

    }

});


/*
========================================
FORGOT PASSWORD
========================================
*/

forgotPassword.addEventListener("click", async function () {

    const userEmail = emailInput.value.trim();


    if (!userEmail) {

        showMessage(
            "❌ पहले Email डालें।",
            "#dc2626"
        );

        emailInput.focus();

        return;
    }


    if (
        !userEmail.includes("@") ||
        !userEmail.includes(".")
    ) {

        showMessage(
            "❌ कृपया सही Email डालें।",
            "#dc2626"
        );

        return;
    }


    forgotPassword.disabled = true;


    try {

        await sendPasswordResetEmail(
            auth,
            userEmail
        );


        showMessage(
            "✅ Password reset link आपके Email पर भेज दिया गया है।",
            "#16a34a"
        );


    } catch (error) {

        console.error(
            "Password Reset Error:",
            error
        );


        if (
            error.code === "auth/user-not-found"
        ) {

            showMessage(
                "❌ इस Email से कोई account नहीं मिला।",
                "#dc2626"
            );

        }

        else if (
            error.code === "auth/invalid-email"
        ) {

            showMessage(
                "❌ Email सही नहीं है।",
                "#dc2626"
            );

        }

        else {

            showMessage(
                "❌ Password reset नहीं हो पाया।",
                "#dc2626"
            );

        }

    }


    forgotPassword.disabled = false;

});

</script></body>
</html>
