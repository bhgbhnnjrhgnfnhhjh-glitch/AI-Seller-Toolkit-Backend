<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - AI Seller Toolkit</title><link rel="stylesheet" href="style.css"><style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f3f4f6;
}

.login-container{

    width:90%;
    max-width:430px;

    margin:60px auto;

    background:white;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 20px rgba(0,0,0,0.12);
}

.login-container h2{

    text-align:center;

    margin-bottom:25px;

    color:#2563eb;
}

.form-group{

    margin-bottom:18px;
}

.form-group label{

    display:block;

    margin-bottom:7px;

    font-weight:bold;
}

.form-group input{

    width:100%;

    padding:13px;

    border:1px solid #d1d5db;

    border-radius:8px;

    font-size:16px;

    outline:none;
}

.form-group input:focus{

    border-color:#2563eb;
}

.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.login-btn:hover{

    background:#1d4ed8;
}

.login-btn:disabled{

    background:#9ca3af;

    cursor:not-allowed;
}

.message{

    margin-top:15px;

    text-align:center;

    font-size:14px;

    min-height:22px;
}

.links{

    text-align:center;

    margin-top:20px;

    line-height:2;
}

.links a{

    color:#2563eb;

    text-decoration:none;

    font-weight:bold;
}

.links a:hover{

    text-decoration:underline;
}

.logo{

    text-align:center;

    font-size:28px;

    margin-bottom:10px;
}

</style></head><body><header><h1>🤖 AI Seller Toolkit</h1><a href="index.html">← Back to Home</a>

</header><div class="login-container"><div class="logo">
🔐
</div><h2>Login to Your Account</h2><form id="loginForm"><div class="form-group"><label for="email">
Email
</label><input
type="email"
id="email"
placeholder="Enter your email"
required
autocomplete="email"

«»

</div><div class="form-group"><label for="password">
Password
</label><input
type="password"
id="password"
placeholder="Enter your password"
required
autocomplete="current-password"

«»

</div><button
type="submit"
class="login-btn"
id="loginBtn"

«»

🔐 Login

</button></form><div
class="message"
id="message"
></div><div class="links"><p>
Don't have an account?
<a href="signup.html">
Create Account
</a>
</p><p>
<a href="index.html">
← Back to Home
</a>
</p></div></div><script type="module">

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    app
}
from "./firebase-config.js";


const auth =
    getAuth(app);


const loginForm =
    document.getElementById("loginForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const loginBtn =
    document.getElementById("loginBtn");


const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(!email){

            message.innerText =
                "Please enter your email.";

            return;

        }


        if(!password){

            message.innerText =
                "Please enter your password.";

            return;

        }


        loginBtn.disabled = true;

        loginBtn.innerText =
            "⏳ Logging in...";

        message.innerText =
            "Please wait...";


        try{


            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            localStorage.setItem(
                "userEmail",
                user.email || email
            );


            message.innerText =
                "✅ Login successful!";


            setTimeout(
                function(){

                    window.location.href =
                        "tools.html";

                },
                700
            );


        }


        catch(error){

            console.error(
                "Firebase Login Error:",
                error
            );


            let errorMessage =
                "Login failed. Please try again.";


            switch(error.code){

                case "auth/invalid-email":

                    errorMessage =
                        "❌ Email address is invalid.";

                    break;


                case "auth/invalid-credential":

                    errorMessage =
                        "❌ Email or password is incorrect.";

                    break;


                case "auth/user-not-found":

                    errorMessage =
                        "❌ This account does not exist.";

                    break;


                case "auth/wrong-password":

                    errorMessage =
                        "❌ Password is incorrect.";

                    break;


                case "auth/user-disabled":

                    errorMessage =
                        "❌ This account has been disabled.";

                    break;


                case "auth/too-many-requests":

                    errorMessage =
                        "❌ Too many attempts. Please try again later.";

                    break;


                default:

                    errorMessage =
                        "❌ Login failed: " +
                        (error.message || "Unknown error");

            }


            message.innerText =
                errorMessage;


            loginBtn.disabled =
                false;


            loginBtn.innerText =
                "🔐 Login";

        }

    }
);

</script></body></html>
