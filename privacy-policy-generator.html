<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Privacy Policy Generator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🌍 AI Privacy Policy Generator</h1>

<a href="tools.html">⬅ Back to Tools</a>

</header>

<div class="container">

<div class="card">

<h2>Create Privacy Policy</h2>

<label>Website Name</label>
<input
type="text"
id="website"
placeholder="Example: AI Seller Toolkit">

<label>Website URL</label>
<input
type="text"
id="url"
placeholder="Example: https://example.com">

<label>Company Name</label>
<input
type="text"
id="company"
placeholder="Example: AI Seller Toolkit">

<label>Contact Email</label>
<input
type="email"
id="email"
placeholder="Example: support@example.com">

<label>Country</label>
<input
type="text"
id="country"
placeholder="Example: India">

<button onclick="generatePolicy()">

Generate Privacy Policy

</button>

</div>

<div class="card">

<h2>Generated Privacy Policy</h2>

<textarea
id="result"
rows="18"
readonly
placeholder="Your Privacy Policy will appear here...">
</textarea>

<button onclick="copyPolicy()">

📋 Copy Privacy Policy

</button>

</div>

</div>

<script src="privacy-policy-generator.js"></script>

</body>

</html>
