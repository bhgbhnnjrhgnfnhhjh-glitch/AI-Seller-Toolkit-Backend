<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Barcode Generator</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:linear-gradient(90deg,#2563eb,#4f46e5);
color:#fff;
text-align:center;
padding:18px;
font-size:24px;
font-weight:bold;
}

.container{
max-width:600px;
margin:30px auto;
background:#fff;
padding:25px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#16a34a;
color:#fff;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.barcode-box{
margin-top:25px;
text-align:center;
padding:20px;
background:#fafafa;
border:1px solid #ddd;
border-radius:8px;
}

#downloadBtn{
display:none;
background:#2563eb;
}

#downloadBtn:hover{
background:#1d4ed8;
}
</style>

</head>

<body>

<header>
📦 Barcode Generator
</header>

<div class="container">

<label>Enter Product Code</label>

<input
type="text"
id="barcodeText"
placeholder="Example: 123456789012">

<button onclick="generateBarcode()">
Generate Barcode
</button>

<div class="barcode-box">
<svg id="barcode"></svg>
</div>

<button id="downloadBtn" onclick="downloadBarcode()">
Download Barcode
</button>

</div>

<script>

function generateBarcode(){

let value=document.getElementById("barcodeText").value.trim();

if(value==""){
alert("Please enter Product Code.");
return;
}

JsBarcode("#barcode",value,{
format:"CODE128",
lineColor:"#000",
width:2,
height:100,
displayValue:true
});

document.getElementById("downloadBtn").style.display="block";

}

function downloadBarcode(){

let svg=document.getElementById("barcode");

let data=new XMLSerializer().serializeToString(svg);

let blob=new Blob([data],{type:"image/svg+xml"});

let url=URL.createObjectURL(blob);

let a=document.createElement("a");

a.href=url;

a.download="barcode.svg";

a.click();

URL.revokeObjectURL(url);

}

</script>

</body>
  </html>
